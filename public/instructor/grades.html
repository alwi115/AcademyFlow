<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132e40">
  <meta name="color-scheme" content="light dark">
  <title>دفتر الدرجات | AcademyFlow</title>
  <style>
/* ===== INLINED FROM /css/app.css ===== */
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --font-display: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;

  --shadow-soft: 0 10px 30px rgba(19, 46, 64, 0.06);
  --shadow-card: 0 8px 24px rgba(19, 46, 64, 0.07);
  --shadow-heavy: 0 18px 52px rgba(19, 46, 64, 0.11);

  --ease: 220ms ease;
}

:root,
html[data-theme='light'] {
  --bg: #f6f8fc;
  --bg-elevated: #ffffff;
  --bg-soft: #eaf0f8;
  --surface: rgba(255,255,255,.94);
  --surface-strong: #ffffff;
  --surface-muted: #f3f6fb;
  --surface-contrast: #132e40;
  --text: #132e40;
  --text-soft: #254758;
  --text-mute: #64758a;
  --line: rgba(19, 46, 64, 0.10);
  --line-strong: rgba(19, 46, 64, 0.17);
  --primary: #3262c8;
  --primary-strong: #244b9b;
  --primary-soft: rgba(50, 98, 200, 0.10);
  --accent: #3262c8;
  --accent-soft: rgba(169, 196, 255, 0.28);
  --success: #23845d;
  --warning: #b67825;
  --danger: #c45151;
  --sidebar: #fbfcff;
  --sidebar-active: rgba(50, 98, 200, 0.10);
  --hero-grad-1: rgba(50,98,200,0.04);
  --hero-grad-2: rgba(169,196,255,0.06);
  --grid-line: rgba(19, 46, 64, 0.025);
}

html[data-theme='dark'] {
  --bg: #101b29;
  --bg-elevated: #122033;
  --bg-soft: #172638;
  --surface: rgba(18, 32, 51, .94);
  --surface-strong: #172638;
  --surface-muted: #19334b;
  --surface-contrast: #f6f8fc;
  --text: #f2f6fb;
  --text-soft: #d5dfec;
  --text-mute: #9aadc2;
  --line: rgba(213, 226, 237, 0.10);
  --line-strong: rgba(213, 226, 237, 0.17);
  --primary: #7aa7ff;
  --primary-strong: #a9c4ff;
  --primary-soft: rgba(122, 167, 255, 0.14);
  --accent: #a9c4ff;
  --accent-soft: rgba(169, 196, 255, 0.14);
  --success: #62c592;
  --warning: #e2a85e;
  --danger: #ef8585;
  --sidebar: #101b29;
  --sidebar-active: rgba(122,167,255,0.13);
  --hero-grad-1: rgba(122,167,255,0.04);
  --hero-grad-2: rgba(169,196,255,0.04);
  --grid-line: rgba(255,255,255,0.025);
  --shadow-soft: 0 12px 34px rgba(0,0,0,.22);
  --shadow-card: 0 10px 28px rgba(0,0,0,.24);
  --shadow-heavy: 0 22px 60px rgba(0,0,0,.32);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  background:
    radial-gradient(circle at 12% 10%, var(--hero-grad-1), transparent 28%),
    radial-gradient(circle at 86% 14%, var(--hero-grad-2), transparent 24%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
  color: var(--text);
  transition: background var(--ease), color var(--ease);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 42px 42px;
  pointer-events: none;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,.22));
}

a { color: inherit; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.h1, h1, h2, h3, h4 {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
}

.page-shell {
  position: relative;
  max-width: 1280px;
  margin: 0 auto;
  padding: 22px 24px 48px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  backdrop-filter: blur(12px);
  border-radius: 22px;
  box-shadow: var(--shadow-soft);
  position: sticky;
  top: 14px;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.brand-badge {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: #fff;
  background: linear-gradient(145deg, var(--primary), var(--primary-strong));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}

.brand-text b {
  display: block;
  font-size: 17px;
}
.brand-text small {
  display: block;
  margin-top: 3px;
  color: var(--text-mute);
  font-size: 11px;
  letter-spacing: .08em;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.nav-links a {
  text-decoration: none;
  color: var(--text-soft);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 14px;
  transition: background var(--ease), color var(--ease);
}
.nav-links a:hover { background: var(--bg-soft); color: var(--text); }

.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.theme-toggle {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text);
  border-radius: 14px;
  display: inline-grid;
  place-items: center;
  box-shadow: var(--shadow-soft);
}

.btn {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  text-decoration: none;
  transition: transform var(--ease), background var(--ease), border-color var(--ease), color var(--ease);
}
.btn:hover { transform: translateY(-1px); }
.btn.primary {
  background: var(--primary);
  color: white;
}
.btn.primary:hover { background: var(--primary-strong); }
.btn.secondary {
  background: var(--bg-elevated);
  border-color: var(--line);
  color: var(--text);
}
.btn.ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text-soft);
}
.btn.soft {
  background: var(--primary-soft);
  color: var(--primary);
}
.btn.wide { width: 100%; }

.hero {
  display: grid;
  grid-template-columns: 1.03fr .97fr;
  gap: 48px;
  align-items: center;
  padding: 72px 6px 44px;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #9a6535;
  font-size: 12px;
  font-weight: 700;
}
html[data-theme='dark'] .kicker { color: #f0c999; }
.kicker::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.hero-copy h1 {
  font-size: clamp(42px, 6vw, 78px);
  line-height: 1.04;
  margin: 18px 0 18px;
}
.hero-copy h1 span { color: var(--primary); }
.hero-copy p {
  margin: 0;
  font-size: 17px;
  line-height: 2;
  color: var(--text-soft);
  max-width: 640px;
}
.hero-metrics {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
}
.hero-metrics article {
  min-width: 142px;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-soft);
}
.hero-metrics strong { display: block; font-size: 22px; margin-bottom: 4px; }
.hero-metrics span { color: var(--text-mute); font-size: 13px; }

.hero-card {
  position: relative;
  padding: 18px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow-heavy);
}
.window-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.window-dots { display: flex; gap: 7px; }
.window-dots span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line-strong);
}
.window-dots span:nth-child(1) { background: var(--primary); }
.window-dots span:nth-child(2) { background: var(--accent); }
.panel-title { font-size: 13px; color: var(--text-mute); }

.dashboard-preview {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 14px;
}
.preview-side {
  padding: 16px 10px;
  border-radius: 20px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.preview-nav {
  display: grid;
  gap: 10px;
}
.preview-nav span {
  height: 34px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
}
.preview-nav span.active {
  background: var(--primary-soft);
  border-color: var(--line);
}
.preview-main {
  display: grid;
  gap: 14px;
}
.preview-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.preview-stats article,
.surface-card {
  padding: 16px;
  border-radius: 18px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.preview-stats article small,
.surface-card small { color: var(--text-mute); display: block; }
.preview-stats article strong { display: block; margin-top: 8px; font-size: 24px; }
.preview-layout {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 12px;
}
.chart {
  min-height: 190px;
  position: relative;
  overflow: hidden;
}
.chart::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to top, transparent 0 38px, var(--line) 39px 40px);
}
.chart svg { position: absolute; inset: 18px 14px 12px; width: calc(100% - 28px); height: calc(100% - 30px); }
.meeting-list { display: grid; gap: 10px; }
.meeting-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.meeting-item i {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 6px var(--primary-soft);
}
.meeting-item b { display: block; font-size: 13px; }
.meeting-item span { color: var(--text-mute); font-size: 12px; }
.floating-note {
  position: absolute;
  left: -14px;
  bottom: 24px;
  padding: 14px 16px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
}
.floating-note b { display: block; margin-bottom: 3px; font-size: 14px; }
.floating-note span { color: var(--text-mute); font-size: 12px; }

.section {
  padding: 42px 0 0;
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.section-head h2 { font-size: clamp(28px, 3vw, 42px); margin: 6px 0 0; }
.section-head p { margin: 0; color: var(--text-soft); max-width: 460px; line-height: 1.9; }

.feature-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.feature-card {
  padding: 22px;
  border-radius: 22px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.feature-card .num {
  width: 40px; height: 40px; border-radius: 14px;
  display: grid; place-items: center;
  background: var(--primary-soft);
  color: var(--primary);
  font-family: var(--font-display);
  font-weight: 800;
  margin-bottom: 18px;
}
.feature-card h3 { margin: 0 0 10px; font-size: 19px; }
.feature-card p { margin: 0; line-height: 1.9; color: var(--text-soft); font-size: 14px; }

.cta-band {
  margin-top: 28px;
  padding: 28px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--bg-elevated), var(--surface-muted));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.cta-band h3 { margin: 0 0 8px; font-size: 28px; }
.cta-band p { margin: 0; color: var(--text-soft); line-height: 1.9; }

.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.auth-card {
  width: min(1080px, 100%);
  display: grid;
  grid-template-columns: 1fr 420px;
  overflow: hidden;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 32px;
  box-shadow: var(--shadow-heavy);
}
.auth-side {
  padding: 40px;
  background: linear-gradient(135deg, var(--surface-muted), transparent);
  border-left: 1px solid var(--line);
}
.auth-side h1 { font-size: clamp(34px, 4vw, 58px); line-height: 1.15; margin: 18px 0 14px; }
.auth-side p { margin: 0; color: var(--text-soft); line-height: 2; max-width: 540px; }
.auth-points {
  display: grid;
  gap: 12px;
  margin-top: 28px;
}
.auth-points article {
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
}
.auth-points strong { display: block; margin-bottom: 5px; }
.auth-points span { color: var(--text-mute); font-size: 13px; }
.auth-form-wrap {
  padding: 34px;
  display: grid;
  align-content: center;
}
.auth-form {
  width: 100%;
}
.auth-form h2 { margin: 16px 0 8px; font-size: 30px; }
.auth-form .lead { margin: 0 0 22px; color: var(--text-soft); line-height: 1.9; }
.field { display: grid; gap: 8px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: var(--text-soft); }
.field input, .field select, .field textarea {
  min-height: 50px;
  padding: 0 14px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: var(--bg-elevated);
  color: var(--text);
  outline: 0;
  transition: border-color var(--ease), background var(--ease);
}
.field textarea { min-height: 120px; padding: 14px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary);
}
.inline-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.note-link { text-decoration: none; color: var(--primary); font-weight: 700; font-size: 13px; }
.form-msg { min-height: 20px; margin-top: 12px; color: var(--danger); font-size: 13px; }

.dashboard-shell {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--sidebar);
  border-left: 1px solid var(--line);
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar .brand { margin-bottom: 28px; }
.side-label {
  color: var(--text-mute);
  font-size: 11px;
  letter-spacing: .12em;
  margin: 16px 12px 10px;
}
.side-nav {
  display: grid;
  gap: 6px;
}
.side-nav a {
  min-height: 46px;
  padding: 0 14px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-soft);
}
.side-nav a.active {
  background: var(--sidebar-active);
  color: var(--text);
  font-weight: 700;
}
.side-icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--bg-soft);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}
.sidebar-foot {
  position: absolute;
  right: 16px;
  left: 16px;
  bottom: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  border-radius: 16px;
  font-size: 12px;
  color: var(--text-soft);
}
.main-content {
  padding: 22px 28px 42px;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 16px;
  margin-bottom: 22px;
}
.page-head p { margin: 8px 0 0; color: var(--text-soft); }
.mobile-toggle { display: none; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.stat-card {
  padding: 20px;
  border-radius: 22px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.stat-card strong { display: block; font-size: 32px; margin-top: 14px; }
.stat-card small { color: var(--text-mute); }

.content-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 14px;
  margin-top: 14px;
}
.card-panel {
  padding: 20px;
  border-radius: 24px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.card-panel h2 { margin: 0; font-size: 20px; }
.card-panel p { color: var(--text-soft); line-height: 1.9; }
.info-list { display: grid; gap: 12px; }
.info-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 14px;
  border-radius: 16px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.info-item b { display: block; margin-bottom: 3px; font-size: 14px; }
.info-item span { color: var(--text-mute); font-size: 12px; }

.table-panel { margin-top: 14px; }
.table-wrap {
  overflow: auto;
  border-radius: 18px;
  border: 1px solid var(--line);
}
.table {
  width: 100%;
  border-collapse: collapse;
  min-width: 640px;
}
.table th, .table td {
  padding: 14px 16px;
  text-align: right;
  border-bottom: 1px solid var(--line);
}
.table th {
  background: var(--surface-muted);
  font-size: 12px;
  color: var(--text-mute);
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--bg-soft); }

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.status::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.status.active { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
.status.trial { color: var(--primary); background: var(--primary-soft); }
.status.frozen, .status.suspended { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.status.grace { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }

.modal[hidden] { display: none !important; }
.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(15, 23, 42, 0.35);
  backdrop-filter: blur(4px);
  padding: 20px;
  z-index: 40;
}
.modal-card {
  width: min(760px, 100%);
  max-height: 92vh;
  overflow: auto;
  padding: 24px;
  border-radius: 28px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-heavy);
}
.modal-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.modal-head p { margin: 6px 0 0; color: var(--text-soft); }
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 14px;
}
.form-grid .span-2 { grid-column: 1 / -1; }
.muted { color: var(--text-mute); }
.empty {
  text-align: center;
  padding: 26px;
  color: var(--text-mute);
}
.note-box {
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--text-soft);
  line-height: 1.8;
  font-size: 13px;
}

.footer-note {

  <script>
/* ===== INLINED FROM /js/ui.js ===== */
(function(){
  const THEME_KEY = 'af_theme';
  const DARK = 'dark';
  const LIGHT = 'light';

  function systemTheme(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT;
  }

  function normalizeTheme(value){
    return value === DARK ? DARK : LIGHT;
  }

  function currentTheme(){
    return normalizeTheme(document.documentElement.getAttribute('data-theme') || localStorage.getItem(THEME_KEY) || systemTheme());
  }

  function updateThemeColor(theme){
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', theme === DARK ? '#08111d' : '#f5f7fb');
  }

  function refreshThemeControls(){
    const theme = currentTheme();
    const dark = theme === DARK;

    document.querySelectorAll('[data-theme-label]').forEach(el => {
      el.textContent = dark ? 'الوضع الفاتح' : 'الوضع الداكن';
    });

    document.querySelectorAll('[data-theme-toggle], .theme-toggle').forEach(el => {
      el.setAttribute('aria-pressed', dark ? 'true' : 'false');
      el.setAttribute('aria-label', dark ? 'التحويل إلى الوضع الفاتح' : 'التحويل إلى الوضع الداكن');
      el.title = dark ? 'التحويل إلى الوضع الفاتح' : 'التحويل إلى الوضع الداكن';

      if (el.matches('[data-theme-icon]')) {
        el.textContent = dark ? '☀' : '◐';
      }
    });
  }

  function applyTheme(theme, persist = true){
    const next = normalizeTheme(theme);
    document.documentElement.setAttribute('data-theme', next);

    if(persist) localStorage.setItem(THEME_KEY, next);

    updateThemeColor(next);
    refreshThemeControls();

    window.dispatchEvent(new CustomEvent('academyflow:themechange', {
      detail: { theme: next }
    }));

    return next;
  }

  function toggleTheme(){
    return applyTheme(currentTheme() === DARK ? LIGHT : DARK, true);
  }

  window.toggleTheme = toggleTheme;
  window.setAcademyFlowTheme = applyTheme;
  window.getAcademyFlowTheme = currentTheme;

  applyTheme(localStorage.getItem(THEME_KEY) || systemTheme(), false);

  function toggleSidebar(){
    const sidebar = document.getElementById('sidebar');
    if(!sidebar) return;
    sidebar.classList.toggle('open');
    document.body.classList.toggle('sidebar-open', sidebar.classList.contains('open'));
  }

  function closeSidebar(){
    const sidebar = document.getElementById('sidebar');
    if(!sidebar) return;
    sidebar.classList.remove('open');
    document.body.classList.remove('sidebar-open');
  }

  window.toggleSidebar = toggleSidebar;
  window.closeSidebar = closeSidebar;

  document.addEventListener('DOMContentLoaded', () => {
    refreshThemeControls();

    document.addEventListener('click', event => {
      const themeButton = event.target.closest('[data-theme-toggle], .theme-toggle');
      if(themeButton){
        event.preventDefault();
        toggleTheme();
        return;
      }

      const reloadButton = event.target.closest('[data-reload]');
      if(reloadButton){
        event.preventDefault();
        location.reload();
        return;
      }

      const backButton = event.target.closest('[data-back]');
      if(backButton){
        event.preventDefault();
        history.length > 1 ? history.back() : location.assign('/');
        return;
      }

      const sidebar = document.getElementById('sidebar');
      if(sidebar && sidebar.classList.contains('open') && window.innerWidth <= 860){
        const toggle = event.target.closest('.mobile-toggle');
        if(!sidebar.contains(event.target) && !toggle) closeSidebar();
      }

      const hashLink = event.target.closest('a[href^="#"]');
      if(hashLink){
        const id = hashLink.getAttribute('href');
        if(id && id.length > 1){
          const target = document.querySelector(id);
          if(target){
            event.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', id);
          }
        }
      }
    });

    document.querySelectorAll('.side-nav a').forEach(link => {
      link.addEventListener('click', () => {
        if(window.innerWidth <= 860) closeSidebar();
      });
    });
  });

  window.addEventListener('resize', () => {
    if(window.innerWidth > 860) closeSidebar();
  });

  if(window.matchMedia){
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = event => {
      if(!localStorage.getItem(THEME_KEY)){
        applyTheme(event.matches ? DARK : LIGHT, false);
      }
    };

    if(media.addEventListener) media.addEventListener('change', onSystemChange);
    else if(media.addListener) media.addListener(onSystemChange);
  }
})();
</script>

        target.innerHTML=`
          <section class="instructor-card">
            <div class="instructor-card-head">
              <div><h2>دروس دوراتك</h2><p>أضف رابط YouTube وسيظهر للطالب داخل AcademyFlow.</p></div>
              <div class="instructor-actions">
                <select class="instructor-search" id="lessonCourseFilter"><option value="">كل الدورات</option>${opts.courses.map(c=>'<option value="'+P().esc(c._id)+'">'+P().esc(c.title)+'</option>').join('')}</select>
                <button class="btn primary" id="lessonAdd" type="button">+ درس</button>
              </div>
            </div>
            <div id="lessonRows"></div>
          </section>`;

        const draw=()=>{
          const course=document.getElementById('lessonCourseFilter').value;
          const filtered=course?rows.filter(x=>String(x.courseId?._id||x.courseId)===String(course)):rows;
          document.getElementById('lessonRows').innerHTML='<div class="instructor-table-wrap"><table class="instructor-table"><thead><tr><th>#</th><th>الدرس</th><th>الدورة</th><th>الفيديو</th><th>المدة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+
          (filtered.length?filtered.map((x,i)=>'<tr><td>'+P().esc(x.order)+'</td><td><b>'+P().esc(x.title)+'</b><br><small>'+P().esc(x.description||'')+'</small></td><td>'+P().esc(x.courseId?.title||'')+'</td><td>'+(x.youtubeId?'YouTube ✓':'—')+'</td><td>'+P().esc(x.durationMinutes||0)+' د</td><td>'+P().status(x.status)+'</td><td><button class="btn soft lesson-edit" data-index="'+i+'" type="button">تعديل</button></td></tr>').join(''):'<tr><td colspan="7" class="instructor-empty">لا توجد دروس.</td></tr>')+
          '</tbody></table></div>';

          document.querySelectorAll('.lesson-edit').forEach(btn=>{
            btn.onclick=()=>openLessonForm(filtered[Number(btn.dataset.index)],opts,load);
          });
        };

        document.getElementById('lessonCourseFilter').onchange=draw;
        document.getElementById('lessonAdd').onclick=()=>openLessonForm(null,opts,load);
        draw();
      }catch(err){target.innerHTML='<div class="instructor-card instructor-empty">'+P().esc(err.message)+'</div>';}
    };
    await load();
  }

  function openLessonForm(row,opts,onDone){
    P().openForm({
      title:row?'تعديل الدرس':'درس جديد',
      values:row?{
        courseId:row.courseId?._id||row.courseId,
        title:row.title,
        description:row.description||'',
        order:row.order,
        videoUrl:row.videoUrl||'',
        durationMinutes:row.durationMinutes||0,
        status:row.status,
        isPreview:Boolean(row.isPreview)
      }:{order:1,status:'draft',durationMinutes:0},
      fields:[
        {name:'courseId',label:'الدورة',type:'select',required:true,placeholder:'اختر الدورة...',options:opts.courses.map(c=>[c._id,c.title])},
        {name:'title',label:'عنوان الدرس',required:true},
        {name:'order',label:'الترتيب',type:'number',required:true,min:1},
        {name:'durationMinutes',label:'المدة بالدقائق',type:'number',min:0},
        {name:'videoUrl',label:'رابط YouTube',type:'url',full:true},
        {name:'description',label:'الوصف',type:'textarea',full:true},
        {name:'status',label:'الحالة',type:'select',required:true,options:[['draft','مسودة'],['published','منشور']]},
        {name:'isPreview',label:'السماح بمعاينة الدرس',type:'checkbox',full:true}
      ],
      submitLabel:row?'حفظ التعديلات':'إضافة الدرس',
      onSubmit:async data=>{
        await P().api(
          row?'/api/instructor/lessons/'+row._id:'/api/instructor/lessons',
          {method:row?'PATCH':'POST',body:JSON.stringify(data)}
        );
        P().toast(row?'تم تعديل الدرس':'تمت إضافة الدرس');
        await onDone();
      }
    });
  }

  async function renderAttendance(){
    const target=document.getElementById('pageContent');
    const load=async()=>{
      target.innerHTML='<div class="instructor-empty">جاري تحميل الحضور...</div>';
      try{
        const [rows,opts]=await Promise.all([P().api('/api/instructor/attendance'),P().getOptions()]);
        target.innerHTML=`
          <section class="instructor-card">
            <div class="instructor-card-head">
              <div><h2>الحضور اليدوي</h2><p>للدروس الحضورية أو أي حالة تحتاج تسجيل يدوي. حضور Zoom موجود في صفحة المحاضرات.</p></div>
              <button class="btn primary" id="attendanceAdd" type="button">+ تسجيل حضور</button>
            </div>
            <div class="instructor-table-wrap"><table class="instructor-table"><thead><tr><th>الطالب</th><th>الدورة</th><th>المجموعة</th><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>
              ${rows.length?rows.map(x=>'<tr><td><b>'+P().esc(x.studentId?.name||'')+'</b></td><td>'+P().esc(x.courseId?.title||'')+'</td><td>'+P().esc(x.groupId?.name||'—')+'</td><td>'+P().fmtDate(x.date,true)+'</td><td>'+P().status(x.status)+'</td><td>'+P().esc(x.note||'—')+'</td></tr>').join(''):'<tr><td colspan="6" class="instructor-empty">لا توجد سجلات حضور.</td></tr>'}
            </tbody></table></div>
          </section>`;

        document.getElementById('attendanceAdd').onclick=()=>P().openForm({
          title:'تسجيل حضور',
          fields:[
            {name:'studentId',label:'الطالب',type:'select',required:true,placeholder:'اختر الطالب...',options:opts.students.map(s=>[s._id,s.name+' · '+s.email])},
            {name:'courseId',label:'الدورة',type:'select',required:true,placeholder:'اختر الدورة...',options:opts.courses.map(c=>[c._id,c.title])},
            {name:'date',label:'التاريخ والوقت',type:'datetime-local',required:true},
            {name:'status',label:'الحالة',type:'select',required:true,options:[['present','حاضر'],['late','متأخر'],['absent','غائب'],['excused','بعذر']]},
            {name:'note',label:'ملاحظة',type:'textarea',full:true}
          ],
          onSubmit:async data=>{
            await P().api('/api/instructor/attendance',{method:'POST',body:JSON.stringify(data)});
            P().toast('تم تسجيل الحضور');await load();
          }
        });
      }catch(err){target.innerHTML='<div class="instructor-card instructor-empty">'+P().esc(err.message)+'</div>';}
    };
    await load();
  }

  async function renderAssignments(){
    const target=document.getElementById('pageContent');
    const load=async()=>{
      target.innerHTML='<div class="instructor-empty">جاري تحميل الواجبات...</div>';
      try{
        const [rows,opts]=await Promise.all([P().api('/api/instructor/assignments'),P().getOptions()]);
        target.innerHTML=`
          <section class="instructor-card">
            <div class="instructor-card-head">
              <div><h2>الواجبات</h2><p>أنشئ الواجب ثم راجع تسليمات الطلاب وصححها.</p></div>
              <button class="btn primary" id="assignmentAdd" type="button">+ واجب</button>
            </div>
            <div class="instructor-course-grid">
              ${rows.length?rows.map((a,i)=>`
                <article class="instructor-course">
                  <div style="display:flex;justify-content:space-between;gap:8px"><span class="instructor-status ${a.status==='published'?'good':'warn'}">${P().esc(a.status==='published'?'منشور':a.status==='closed'?'مغلق':'مسودة')}</span><span>${P().esc(a.totalMarks)} درجة</span></div>
                  <h3 style="margin-top:10px">${P().esc(a.title)}</h3>
                  <p>${P().esc(a.courseId?.title||'')} · التسليم ${P().fmtDate(a.dueAt,true)}</p>
                  <div class="instructor-meta"><span>${P().esc(a.submissionCount)} تسليم</span><span>${P().esc(a.pendingCount)} تحتاج تصحيح</span><span>${P().esc(a.gradedCount)} مصححة</span></div>
                  <div class="instructor-actions" style="margin-top:10px">
                    <button class="btn soft assignment-details" data-index="${i}" type="button">تفاصيل</button>
                    <button class="btn soft assignment-edit" data-index="${i}" type="button">تعديل</button>
                    ${a.status!=='closed'?'<button class="btn soft assignment-extend" data-index="'+i+'" type="button">تمديد</button>':''}
                    <button class="btn ${a.status==='closed'?'primary':'ghost'} assignment-status" data-index="${i}" data-next="${a.status==='closed'?'published':'closed'}" type="button">${a.status==='closed'?'إعادة فتح':'إغلاق'}</button>
                    <button class="btn ${a.pendingCount?'primary':'soft'} assignment-open" data-index="${i}" type="button">التسليمات</button>
                  </div>
                </article>
              `).join(''):'<div class="instructor-empty">لا توجد واجبات.</div>'}
            </div>
          </section>`;

        document.getElementById('assignmentAdd').onclick=()=>openAssignmentForm(opts,load);
        document.querySelectorAll('.assignment-open').forEach(btn=>{
          btn.onclick=()=>openSubmissions(rows[Number(btn.dataset.index)],load);
        });
        document.querySelectorAll('.assignment-edit').forEach(btn=>{
          btn.onclick=()=>openAssignmentForm(opts,load,rows[Number(btn.dataset.index)]);
        });

        document.querySelectorAll('.assignment-details').forEach(btn=>{
          btn.onclick=()=>{
            const a=rows[Number(btn.dataset.index)];
            P().openDetails({
              title:a.title,
              subtitle:'تفاصيل الواجب',
              items:[
                ['الدورة',a.courseId?.title||'—'],
                ['الحالة',a.status],
                ['الدرجة الكاملة',a.totalMarks],
                ['درجة النجاح',a.passingMark],
                ['آخر موعد',P().fmtDate(a.dueAt,true)],
                ['عدد التسليمات',a.submissionCount],
                ['بانتظار التصحيح',a.pendingCount],
                ['تم التصحيح',a.gradedCount],
                ['التعليمات',a.description||'—']
              ]
            });
          };
        });

        document.querySelectorAll('.assignment-extend').forEach(btn=>{
          btn.onclick=()=>{
            const a=rows[Number(btn.dataset.index)];
            P().openForm({
              title:'تمديد موعد الواجب',
              values:{dueAt:P().inputDate(a.dueAt,true)},
              fields:[{name:'dueAt',label:'آخر موعد جديد',type:'datetime-local',required:true}],
              submitLabel:'حفظ التمديد',
              onSubmit:async data=>{
                await P().api('/api/instructor/assignments/'+a._id,{method:'PATCH',body:JSON.stringify(data)});
                P().toast('تم تمديد موعد الواجب');
                await load();
              }
            });
          };
        });

        document.querySelectorAll('.assignment-status').forEach(btn=>{
          btn.onclick=async()=>{
            const a=rows[Number(btn.dataset.index)];
            const next=btn.dataset.next;
            const label=next==='closed'?'إغلاق الواجب':'إعادة فتح الواجب';
            if(!confirm(label+'؟'))return;

            try{
              await P().api('/api/instructor/assignments/'+a._id,{method:'PATCH',body:JSON.stringify({status:next})});
              P().toast(next==='closed'?'تم إغلاق الواجب':'تمت إعادة فتح الواجب');
              await load();
            }catch(err){
              P().toast(err.message,'error');
            }
          };
        });
      }catch(err){target.innerHTML='<div class="instructor-card instructor-empty">'+P().esc(err.message)+'</div>';}
    };
    await load();
  }

  function openAssignmentForm(opts,onDone,row=null){
    P().openForm({
      title:row?'تعديل الواجب':'واجب جديد',
      fields:[
        {name:'courseId',label:'الدورة',type:'select',required:true,placeholder:'اختر الدورة...',options:opts.courses.map(c=>[c._id,c.title])},
        {name:'title',label:'عنوان الواجب',required:true},
        {name:'dueAt',label:'آخر موعد',type:'datetime-local'},
        {name:'totalMarks',label:'الدرجة',type:'number',min:1},
        {name:'passingMark',label:'درجة النجاح',type:'number',min:0},
        {name:'status',label:'الحالة',type:'select',required:true,options:[['draft','مسودة'],['published','منشور'],['closed','مغلق']]},
        {name:'description',label:'التعليمات',type:'textarea',full:true}
      ],
      values:row?{
        courseId:row.courseId?._id||row.courseId,
        title:row.title,
        dueAt:row.dueAt?new Date(new Date(row.dueAt).getTime()-new Date(row.dueAt).getTimezoneOffset()*60000).toISOString().slice(0,16):'',
        totalMarks:row.totalMarks,
        passingMark:row.passingMark,
        status:row.status,
        description:row.description||''
      }:{totalMarks:100,passingMark:50,status:'draft'},
      submitLabel:row?'حفظ التعديلات':'إنشاء الواجب',
      onSubmit:async data=>{
        await P().api(row?'/api/instructor/assignments/'+row._id:'/api/instructor/assignments',{method:row?'PATCH':'POST',body:JSON.stringify(data)});
        P().toast(row?'تم تعديل الواجب':'تم إنشاء الواجب');await onDone();
      }
    });
  }

  async function openSubmissions(assignment,onDone){
    const data=await P().api('/api/instructor/assignments/'+assignment._id+'/submissions');
    const modal=document.getElementById('instructorModal');
    const form=document.getElementById('instructorModalForm');
    document.getElementById('instructorModalTitle').textContent='تسليمات الواجب';
    document.getElementById('instructorModalSubtitle').textContent=assignment.title;

    form.innerHTML='<div class="full instructor-table-wrap"><table class="instructor-table"><thead><tr><th>الطالب</th><th>التسليم</th><th>الحالة</th><th>الدرجة</th><th>إجراء</th></tr></thead><tbody>'+
      (data.rows.length?data.rows.map((s,i)=>'<tr><td><b>'+P().esc(s.studentId?.name||'')+'</b><br><small>'+P().esc(s.studentId?.email||'')+'</small></td><td>'+P().fmtDate(s.submittedAt,true)+'</td><td>'+P().status(s.status)+'</td><td>'+P().esc(s.score??'—')+' / '+P().esc(assignment.totalMarks)+'</td><td><button class="btn '+(s.status==='submitted'?'primary':'soft')+' grade-submission" data-index="'+i+'" type="button">'+(s.status==='submitted'?'تصحيح':'مراجعة')+'</button></td></tr>').join(''):'<tr><td colspan="5" class="instructor-empty">لا توجد تسليمات.</td></tr>')+
      '</tbody></table></div><div class="instructor-form-actions"><button class="btn ghost" id="submissionClose" type="button">إغلاق</button></div>';

    modal.hidden=false;
    document.getElementById('submissionClose').onclick=()=>modal.hidden=true;
    form.onsubmit=e=>e.preventDefault();

    document.querySelectorAll('.grade-submission').forEach(btn=>{
      btn.onclick=()=>openGradeSubmission(assignment,data.rows[Number(btn.dataset.index)],async()=>{
        await onDone();
      });
    });
  }

  function openGradeSubmission(assignment,submission,onDone){
    P().openForm({
      title:'تصحيح الواجب',
      subtitle:submission.studentId?.name||'طالب',
      values:{score:submission.score??'',feedback:submission.feedback||''},
      fields:[
        {name:'score',label:'الدرجة من '+assignment.totalMarks,type:'number',required:true,min:0,max:assignment.totalMarks},
        {name:'feedback',label:'تعليق للطالب',type:'textarea',full:true}
      ],
      submitLabel:'حفظ التصحيح',
      onSubmit:async data=>{
        await P().api('/api/instructor/assignments/'+assignment._id+'/submissions/'+submission._id,{method:'PATCH',body:JSON.stringify(data)});
        P().toast('تم حفظ التصحيح');await onDone();
      }
    });
  }

  return {renderLessons,renderAttendance,renderAssignments};
})();
</script>
  <script>
/* ===== INLINED FROM /js/instructor-live.js ===== */
window.InstructorLive = (() => {
  function P(){ return window.InstructorPortal; }

  function attendanceLabel(value){
    return ({
      present:'حاضر',
      late:'متأخر',
      absent:'غائب',
      excused:'بعذر'
    })[value] || value;
  }

  async function render(){
    const target=document.getElementById('pageContent');

    const load=async()=>{
      target.innerHTML='<div class="instructor-empty">جاري تحميل المحاضرات...</div>';

      try{
        const [rows,opts,seriesRows]=await Promise.all([
          P().api('/api/instructor/live'),
          P().getOptions(),
          P().api('/api/instructor/live-series')
        ]);

        target.innerHTML=`
          <section class="instructor-card">
            <div class="instructor-card-head">
              <div>
                <h2>المحاضرات المباشرة</h2>
                <p>أنشئ جلسة Zoom وتابع الحضور من أول دخول حتى وقت الخروج.</p>
              </div>
              <div class="instructor-actions">
                <button class="btn soft" id="liveSeriesAdd" type="button">+ جدول متكرر</button>
                <button class="btn primary" id="liveAdd" type="button">+ محاضرة</button>
              </div>
            </div>

            <div class="instructor-live-grid">
              ${rows.length?rows.map((s,i)=>`
                <article class="instructor-live-card">
                  <div class="instructor-live-head">
                    <div>
                      <span class="instructor-status ${s.status==='live'?'good':s.status==='scheduled'?'warn':'info'}">${P().esc(s.status==='live'?'مباشر':s.status==='scheduled'?'مجدولة':s.status==='ended'?'منتهية':'ملغاة')}</span>
                      <h3>${P().esc(s.title)}</h3>
                    </div>
                    <span>${P().esc(s.startAtDisplay || P().fmtDate(s.startAt,true))}</span>
                  </div>

                  <p>${P().esc(s.course?.title||'')} ${s.group?.name?'· '+P().esc(s.group.name):'· كل المجموعات'} · ${P().esc(s.durationMinutes)} دقيقة</p>

                  <div class="instructor-meta">
                    <span>التأخير بعد ${P().esc(s.lateAfterMinutes)} د</span>
                    <span>فتح الدخول قبل ${P().esc(s.joinWindowBeforeMinutes)} د</span>
                    <span>${s.attendanceEnabled?'التحضير مفعل':'التحضير متوقف'}</span>
                    <span>${s.zoomReady?'Zoom جاهز':'Zoom غير مربوط'}</span>
                    <span>تذكير قبل ${P().esc(s.reminderMinutes ?? 5)} د</span>
                    ${s.reminderCompletedAt
                      ? '<span>الموقع '+P().esc(s.reminderStats?.inApp || 0)+' · Email '+P().esc(s.reminderStats?.email || 0)+(Number(s.reminderStats?.emailFailed || 0)?' · فشل '+P().esc(s.reminderStats.emailFailed):'')+'</span>'
                      : '<span>التذكير لم يُرسل بعد</span>'}
                    ${s.series?'<span>جدول متكرر</span>':''}
                  </div>

                  <div class="instructor-actions" style="margin-top:11px">
                    <button class="btn soft live-details" data-index="${i}" type="button">تفاصيل</button>
                    <button class="btn soft live-edit" data-index="${i}" type="button">تعديل</button>
                    ${s.status!=='cancelled'?'<button class="btn soft live-extend" data-index="'+i+'" type="button">تمديد</button>':''}
                    <button class="btn ${s.status==='cancelled'?'primary':'ghost'} live-status" data-index="${i}" data-next="${s.status==='cancelled'?'scheduled':'cancelled'}" type="button">${s.status==='cancelled'?'إعادة الجدولة':'إلغاء'}</button>
                    ${!s.zoomReady && s.status==='scheduled'?'<button class="btn soft live-reconnect" data-index="'+i+'" type="button">إنشاء رابط Zoom</button>':''}
                    <button class="btn primary live-start" data-index="${i}" type="button" ${!s.hostReady||s.status==='cancelled'?'disabled':''}>بدء Zoom</button>
                    <button class="btn soft live-attendance" data-index="${i}" type="button">سجل الحضور</button>

              `).join(''):'<div class="instructor-empty">لا توجد محاضرات بعد.</div>'}
            </div>
          </section>

          <section class="instructor-card instructor-section">
            <div class="instructor-card-head">
              <div>
                <h2>الجداول المتكررة</h2>
                <p>أنشئ كل حصص الأحد/الثلاثاء أو أي أيام أخرى دفعة واحدة.</p>
              </div>
            </div>
            <div class="instructor-list">
              ${seriesRows.length?seriesRows.map((s,i)=>`
                <div class="instructor-list-row">
                  <div>
                    <b>${P().esc(s.title)}</b>
                    <span>${P().esc(s.courseId?.title||'')} ${s.groupId?.name?'· '+P().esc(s.groupId.name):'· كل المجموعات'} · ${weekdayText(s.weekdays)} · ${P().esc(s.time)} · ${P().esc(s.sessionCount)} حصة</span>
                    <small>${P().esc(s.startDate)} → ${P().esc(s.endDate)} · تذكير قبل ${P().esc(s.reminderMinutes)} د</small>
                  </div>
                  <div class="instructor-actions">
                    ${P().status(s.status)}
                    ${s.status==='active'?'<button class="btn ghost series-cancel" data-index="'+i+'" type="button">إلغاء الحصص القادمة</button>':''}
                  </div>
                </div>
              `).join(''):'<div class="instructor-empty">لا توجد جداول متكررة بعد.</div>'}
            </div>
          </section>`;

        document.getElementById('liveAdd').onclick=()=>openCreate(opts,load);
        document.getElementById('liveSeriesAdd').onclick=()=>openSeries(opts,load);

        document.querySelectorAll('.series-cancel').forEach(btn=>{
          btn.onclick=()=>cancelSeries(seriesRows[Number(btn.dataset.index)],load);
        });

        document.querySelectorAll('.live-start').forEach(btn=>{
          btn.onclick=()=>startSession(rows[Number(btn.dataset.index)]);
        });

        document.querySelectorAll('.live-reconnect').forEach(btn=>{
          btn.onclick=async()=>{
            const session=rows[Number(btn.dataset.index)];
            btn.disabled=true;
            try{
              const updated=await P().api('/api/instructor/live/'+encodeURIComponent(session.id),{
                method:'PATCH',
                body:JSON.stringify({})
              });
              if(updated.zoomReady){
                P().toast('تم إنشاء رابط Zoom');
              }else{
                P().toast('تكامل Zoom غير مفعل في إعدادات السيرفر','error');
              }
              await load();
            }catch(err){
              P().toast(err.message,'error');
              btn.disabled=false;
            }
          };
        });

        document.querySelectorAll('.live-attendance').forEach(btn=>{
          btn.onclick=()=>openAttendance(rows[Number(btn.dataset.index)],load);
        });

        document.querySelectorAll('.live-details').forEach(btn=>{
          btn.onclick=()=>openSessionDetails(rows[Number(btn.dataset.index)]);
        });

        document.querySelectorAll('.live-edit').forEach(btn=>{
          btn.onclick=()=>openCreate(opts,load,rows[Number(btn.dataset.index)]);
        });

        document.querySelectorAll('.live-extend').forEach(btn=>{
          btn.onclick=()=>extendSession(rows[Number(btn.dataset.index)],load);
        });

        document.querySelectorAll('.live-status').forEach(btn=>{
          btn.onclick=()=>changeSessionStatus(
            rows[Number(btn.dataset.index)],
            btn.dataset.next,
            load
          );
        });
      }catch(err){
        target.innerHTML='<div class="instructor-card instructor-empty">'+P().esc(err.message)+'</div>';
      }
    };

    await load();
  }

  const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  function weekdayText(days){
    return (days||[]).map(x=>dayNames[Number(x)]||x).join('، ');
  }

  function groupOptions(opts){
    const courseMap=new Map((opts.courses||[]).map(c=>[String(c._id),c.title]));
    return (opts.groups||[]).map(g=>[
      g._id,
      g.name+' · '+(courseMap.get(String(g.courseId))||'دورة')
    ]);
  }

  function openSeries(opts,onDone){
    const modal=document.getElementById('instructorModal');
    const form=document.getElementById('instructorModalForm');
    document.getElementById('instructorModalTitle').textContent='جدول محاضرات متكرر';
    document.getElementById('instructorModalSubtitle').textContent='حدد الأيام والوقت والمدة، وسيتم إنشاء كل الحصص تلقائيًا.';

    form.innerHTML=`
      <div class="field"><label>الدورة</label><select name="courseId" id="seriesCourse" required>
        <option value="">اختر الدورة...</option>
        ${opts.courses.map(c=>'<option value="'+P().esc(c._id)+'">'+P().esc(c.title)+'</option>').join('')}
      </select></div>
      <div class="field"><label>المجموعة</label><select name="groupId" id="seriesGroup">
        <option value="">كل المجموعات</option>
      </select></div>
      <div class="field full"><label>عنوان المحاضرات</label><input name="title" required placeholder="مثال: أساسيات البرمجة"></div>
      <div class="field"><label>تاريخ البداية</label><input name="startDate" type="date" required></div>
      <div class="field"><label>تاريخ النهاية</label><input name="endDate" type="date" required></div>
      <div class="field"><label>وقت الحصة</label><input name="time" type="time" required></div>
      <div class="field"><label>مدة الحصة بالدقائق</label><input name="durationMinutes" type="number" min="1" value="60" required></div>

      <div class="full instructor-note">
        <b>أيام الحصص</b>
        <div class="instructor-weekdays" id="seriesWeekdays">
          ${dayNames.map((name,index)=>'<label><input type="checkbox" value="'+index+'"><span>'+P().esc(name)+'</span></label>').join('')}
        </div>
      </div>

      <div class="field"><label>يعتبر متأخر بعد</label><input name="lateAfterMinutes" type="number" min="0" value="10"></div>
      <div class="field"><label>فتح الدخول قبل</label><input name="joinWindowBeforeMinutes" type="number" min="0" value="15"></div>
      <div class="field"><label>التذكير قبل (دقائق)</label><input name="reminderMinutes" type="number" min="0" max="1440" value="5"></div>
      <div class="field full"><label>الوصف</label><textarea name="description"></textarea></div>
      <label class="instructor-note full"><input name="attendanceEnabled" type="checkbox" checked> تفعيل التحضير التلقائي</label>
      <label class="instructor-note full"><input name="notifyInApp" type="checkbox" checked> تنبيه داخل AcademyFlow</label>
      <label class="instructor-note full"><input name="notifyEmail" type="checkbox" checked> تذكير عبر البريد الإلكتروني</label>

      <div class="instructor-form-message" id="seriesMessage"></div>
      <div class="instructor-form-actions">
        <button class="btn ghost" id="seriesCancel" type="button">إلغاء</button>
        <button class="btn primary" type="submit">إنشاء الجدول</button>
      </div>
    `;

    modal.hidden=false;
    document.getElementById('seriesCancel').onclick=()=>modal.hidden=true;

    const courseSelect=document.getElementById('seriesCourse');
    const groupSelect=document.getElementById('seriesGroup');

    const syncGroups=()=>{
      const courseId=courseSelect.value;
      const groups=(opts.groups||[]).filter(g=>String(g.courseId)===String(courseId));
      groupSelect.innerHTML='<option value="">كل المجموعات</option>'+
        groups.map(g=>'<option value="'+P().esc(g._id)+'">'+P().esc(g.name)+'</option>').join('');
    };
    courseSelect.onchange=syncGroups;

    form.onsubmit=async e=>{
      e.preventDefault();
      const btn=form.querySelector('button[type="submit"]');
      const msg=document.getElementById('seriesMessage');
      const data=Object.fromEntries(new FormData(form).entries());
      data.weekdays=[...document.querySelectorAll('#seriesWeekdays input:checked')].map(x=>Number(x.value));
      data.attendanceEnabled=form.elements.attendanceEnabled.checked;
      data.notifyInApp=form.elements.notifyInApp.checked;
      data.notifyEmail=form.elements.notifyEmail.checked;

      if(!data.weekdays.length){
        msg.textContent='اختر يومًا واحدًا على الأقل.';
        return;
      }

      btn.disabled=true;
      btn.textContent='جاري إنشاء الحصص...';
      msg.textContent='';

      try{
        const result=await P().api('/api/instructor/live-series',{
          method:'POST',
          body:JSON.stringify(data)
        });
        modal.hidden=true;
        P().toast('تم إنشاء '+result.createdSessions+' حصة'+(result.zoomFailures?' · '+result.zoomFailures+' بدون رابط Zoom':''));
        await onDone();
      }catch(err){
        msg.textContent=err.message;
      }finally{
        btn.disabled=false;
        btn.textContent='إنشاء الجدول';
      }
    };
  }

  async function cancelSeries(series,onDone){
    if(!confirm('إلغاء جميع الحصص القادمة في هذا الجدول؟ الحصص السابقة وسجلات الحضور لن تُحذف.'))return;

    try{
      const result=await P().api('/api/instructor/live-series/'+encodeURIComponent(series._id)+'/cancel-future',{
        method:'PATCH'
      });
      P().toast('تم إلغاء '+result.cancelled+' حصة قادمة');
      await onDone();
    }catch(err){
      P().toast(err.message,'error');
    }
  }

  function openCreate(opts,onDone,row=null){
    P().openForm({
      title:row?'تعديل المحاضرة':'محاضرة Zoom جديدة',
      subtitle:row
        ? 'يمكنك تعديل الموعد والمدة وإعدادات الحضور من نفس المكان.'
        : 'يتم إنشاء رابط الطالب ورابط المضيف تلقائيًا عند تفعيل Zoom.',
      values:row?{
        courseId:row.course?._id||row.course,
        groupId:row.group?._id||row.group||'',
        title:row.title,
        startAt:row.startAtLocal || P().inputDate(row.startAt,true),
        durationMinutes:row.durationMinutes,
        lateAfterMinutes:row.lateAfterMinutes,
        joinWindowBeforeMinutes:row.joinWindowBeforeMinutes,
        reminderMinutes:row.reminderMinutes ?? 5,
        description:row.description||'',
        attendanceEnabled:Boolean(row.attendanceEnabled),
        notifyInApp:row.notifyInApp !== false,
        notifyEmail:row.notifyEmail !== false
      }:{
        durationMinutes:60,
        attendanceEnabled:true,
        lateAfterMinutes:10,
        joinWindowBeforeMinutes:15,
        reminderMinutes:5,
        notifyInApp:true,
        notifyEmail:true
      },
      fields:[
        {name:'courseId',label:'الدورة',type:'select',required:true,placeholder:'اختر الدورة...',options:opts.courses.map(c=>[c._id,c.title])},
        {name:'groupId',label:'المجموعة',type:'select',placeholder:'كل المجموعات',options:groupOptions(opts)},
        {name:'title',label:'عنوان المحاضرة',required:true},
        {name:'startAt',label:'موعد البداية',type:'datetime-local',required:true},
        {name:'durationMinutes',label:'المدة بالدقائق',type:'number',required:true,min:1},
        {name:'lateAfterMinutes',label:'يعتبر متأخر بعد كم دقيقة؟',type:'number',min:0},
        {name:'joinWindowBeforeMinutes',label:'فتح زر الدخول قبل الموعد بدقائق',type:'number',min:0},
        {name:'reminderMinutes',label:'إرسال التذكير قبل (دقائق)',type:'number',min:0},
        {name:'description',label:'الوصف',type:'textarea',full:true},
        {name:'attendanceEnabled',label:'تفعيل التحضير التلقائي عند دخول الطالب من AcademyFlow',type:'checkbox',full:true},
        {name:'notifyInApp',label:'إرسال تنبيه داخل AcademyFlow',type:'checkbox',full:true},
        {name:'notifyEmail',label:'إرسال تذكير عبر البريد الإلكتروني',type:'checkbox',full:true}
      ],
      submitLabel:row?'حفظ التعديلات':'إنشاء المحاضرة',
      onSubmit:async data=>{
        await P().api(
          row?'/api/instructor/live/'+encodeURIComponent(row.id):'/api/instructor/live',
          {method:row?'PATCH':'POST',body:JSON.stringify(data)}
        );
        P().toast(row?'تم تعديل المحاضرة':'تم إنشاء المحاضرة');
        await onDone();
      }
    });
  }

  function openSessionDetails(session){
    P().openDetails({
      title:session.title,
      subtitle:'تفاصيل المحاضرة المباشرة',
      items:[
        ['الدورة',session.course?.title||'—'],
        ['المجموعة',session.group?.name||'كل المجموعات'],
        ['موعد البداية',session.startAtDisplay || P().fmtDate(session.startAt,true)],
        ['المدة',session.durationMinutes+' دقيقة'],
        ['الحالة',session.status],
        ['التحضير',session.attendanceEnabled?'مفعل':'متوقف'],
        ['التأخير بعد',session.lateAfterMinutes+' دقيقة'],
        ['فتح الدخول قبل',session.joinWindowBeforeMinutes+' دقيقة'],
        ['التذكير قبل',(session.reminderMinutes ?? 5)+' دقيقة'],
        ['تنبيه داخل النظام',session.notifyInApp!==false?'مفعل':'متوقف'],
        ['البريد الإلكتروني',session.notifyEmail!==false?'مفعل':'متوقف'],
        ['Zoom',session.zoomReady?'جاهز':'غير مربوط'],
        ['الوصف',session.description||'—']
      ]
    });
  }

  function extendSession(session,onDone){
    P().openForm({
      title:'تمديد المحاضرة',
      subtitle:'حدد المدة الجديدة كاملة بالدقائق، وستتزامن مع Zoom إذا كان مربوطًا.',
      values:{durationMinutes:session.durationMinutes},
      fields:[
        {name:'durationMinutes',label:'المدة الجديدة بالدقائق',type:'number',required:true,min:1}
      ],
      submitLabel:'حفظ التمديد',
      onSubmit:async data=>{
        await P().api(
          '/api/instructor/live/'+encodeURIComponent(session.id),
          {method:'PATCH',body:JSON.stringify(data)}
        );
        P().toast('تم تمديد المحاضرة');
        await onDone();
      }
    });
  }

  async function changeSessionStatus(session,next,onDone){
    const label=next==='cancelled'?'إلغاء المحاضرة':'إعادة جدولة المحاضرة';
    if(!confirm(label+'؟'))return;

    try{
      await P().api(
        '/api/instructor/live/'+encodeURIComponent(session.id),
        {method:'PATCH',body:JSON.stringify({status:next})}
      );
      P().toast(next==='cancelled'?'تم إلغاء المحاضرة':'تمت إعادة جدولة المحاضرة');
      await onDone();
    }catch(err){
      P().toast(err.message,'error');
    }
  }

  async function startSession(session){
    const popup=window.open('about:blank','_blank');
    try{
      const data=await P().api('/api/instructor/live/'+encodeURIComponent(session.id)+'/start');
      if(popup) popup.location.href=data.startUrl;
      else location.href=data.startUrl;
    }catch(err){
      if(popup) popup.close();
      P().toast(err.message,'error');
    }
  }

  function summary(rows){
    const counts={present:0,late:0,absent:0,excused:0};
    rows.forEach(r=>{if(counts[r.attendanceStatus]!==undefined)counts[r.attendanceStatus]++;});
    return counts;
  }

  async function openAttendance(session,onDone){
    const data=await P().api('/api/instructor/live/'+encodeURIComponent(session.id)+'/attendance');
    const modal=document.getElementById('instructorModal');
    const form=document.getElementById('instructorModalForm');
    const counts=summary(data.rows);

    document.getElementById('instructorModalTitle').textContent='سجل حضور المحاضرة';
    document.getElementById('instructorModalSubtitle').textContent=data.session.title+' · '+(data.session.startAtDisplay || P().fmtDate(data.session.startAt,true));

    form.innerHTML=`
      <div class="full instructor-attendance-summary">
        <span>حاضر<b>${counts.present}</b></span>
        <span>متأخر<b>${counts.late}</b></span>
        <span>غائب<b>${counts.absent}</b></span>
        <span>بعذر<b>${counts.excused}</b></span>
      </div>

      <div class="full instructor-note">
        <b>طريقة القراءة:</b> "تم التحقق بواسطة Zoom" يعني أن Zoom Webhook أكد دخول الطالب فعليًا.
        أما "دخول عبر البوابة" فيعني أن الطالب ضغط زر الدخول من AcademyFlow وتم تسجيل وقت انتقاله إلى Zoom.
      </div>

      <div class="full instructor-table-wrap" style="margin-top:10px">
        <table class="instructor-table">
          <thead>
            <tr>
              <th>الطالب</th>
              <th>الحالة</th>
              <th>أول دخول</th>
              <th>التأخير</th>
              <th>إعادات الدخول</th>
              <th>المدة</th>
              <th>المصدر</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>
            ${data.rows.length?data.rows.map((r,i)=>`
              <tr>
                <td><b>${P().esc(r.student?.name||'')}</b><br><small>${P().esc(r.student?.email||'')}</small></td>
                <td>${P().status(r.attendanceStatus)}</td>
                <td>${P().fmtDate(r.firstJoinedAt||r.firstPortalAt,true)}</td>
                <td>${r.lateMinutes?P().esc(r.lateMinutes)+' د':'—'}</td>
                <td>${P().esc(Math.max(r.zoomJoinCount||0,r.portalJoinCount||0))}</td>
                <td>${P().fmtDuration(r.totalDurationSeconds)}</td>
                <td>${r.verifiedByZoom?'<span class="instructor-verified">تم التحقق بواسطة Zoom</span>':r.firstPortalAt?'دخول عبر البوابة':'—'}</td>
                <td><button class="btn soft edit-live-attendance" data-index="${i}" type="button">تعديل</button></td>
              </tr>
            `).join(''):'<tr><td colspan="8" class="instructor-empty">لا يوجد طلاب في هذه الدورة.</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="instructor-form-actions full">
        <button class="btn ghost" id="liveAttendanceClose" type="button">إغلاق</button>
      </div>
    `;

    modal.hidden=false;
    document.getElementById('liveAttendanceClose').onclick=()=>modal.hidden=true;
    form.onsubmit=e=>e.preventDefault();

    document.querySelectorAll('.edit-live-attendance').forEach(btn=>{
      btn.onclick=()=>editAttendance(session,data.rows[Number(btn.dataset.index)],async()=>{
        await openAttendance(session,onDone);
      });
    });
  }

  function editAttendance(session,row,onDone){
    P().openForm({
      title:'تعديل الحضور',
      subtitle:row.student?.name||'طالب',
      values:{
        attendanceStatus:row.attendanceStatus,
        lateMinutes:row.lateMinutes||0,
        note:row.note||''
      },
      fields:[
        {name:'attendanceStatus',label:'الحالة',type:'select',required:true,options:[
          ['present','حاضر'],
          ['late','متأخر'],
          ['absent','غائب'],
          ['excused','بعذر']
        ]},
        {name:'lateMinutes',label:'دقائق التأخير',type:'number',min:0},
        {name:'note',label:'ملاحظة',type:'textarea',full:true}
      ],
      submitLabel:'حفظ الحضور',
      onSubmit:async data=>{
        await P().api(
          '/api/instructor/live/'+encodeURIComponent(session.id)+'/attendance/'+encodeURIComponent(row.student._id),
          {method:'PATCH',body:JSON.stringify(data)}
        );
        P().toast('تم تحديث الحضور');
        await onDone();
      }
    });
  }

  return {render};
})();
</script>
  <script>
/* ===== INLINED FROM /js/instructor-app.js ===== */
window.InstructorPortal = (() => {
  let user = null;
  try { user = JSON.parse(localStorage.getItem('af_user') || 'null'); } catch {}

  if (!user || user.role !== 'instructor') {
    location.replace('/academy/login.html');
    return {};
  }

  const page = document.body.dataset.page || 'dashboard';
  let optionsCache = null;
  let toastTimer = null;

  const meta = {
    dashboard:['لوحة المدرب','ملخص دوراتك وطلابك وما يحتاج متابعتك.'],
    courses:['دوراتي','الدورات المسندة لك ونسب تقدم الطلاب.'],
    lessons:['الدروس','أضف وعدّل الدروس وروابط YouTube.'],
    groups:['المجموعات','المجموعات المرتبطة بدوراتك.'],
    students:['طلابي','الطلاب المسجلون في دوراتك ومجموعاتك.'],
    attendance:['الحضور','الحضور اليدوي وسجلات التحضير.'],
    assignments:['الواجبات','إنشاء الواجبات وتصحيح تسليمات الطلاب.'],
    quizzes:['الاختبارات','إنشاء الاختبارات ومتابعة المحاولات.'],
    'quiz-builder':['منشئ الاختبار','الأسئلة والمحاولات والتصحيح اليدوي.'],
    live:['المحاضرات المباشرة','Zoom والتحضير التلقائي للحضور.'],
    grades:['دفتر الدرجات','ملخص تقدم الطالب ودرجات الاختبارات والواجبات.'],
    notifications:['إعلانات الطلاب','أرسل إعلانًا لطلاب دورة محددة.'],
    profile:['حسابي','بيانات المدرب وأمان الحساب.']
  };

  const navGroups = [
    {label:'الرئيسية',items:[['dashboard','الرئيسية','⌂']]},
    {label:'التعليم',items:[
      ['courses','دوراتي','C'],
      ['lessons','الدروس','▶'],
      ['groups','المجموعات','G'],
      ['live','المحاضرات','Z'],
      ['assignments','الواجبات','A'],
      ['quizzes','الاختبارات','Q']
    ]},
    {label:'الطلاب',items:[
      ['students','طلابي','S'],
      ['attendance','الحضور','✓'],
      ['grades','دفتر الدرجات','R']
    ]},
    {label:'التواصل والحساب',items:[
      ['notifications','الإعلانات','N'],
      ['profile','حسابي','U']
    ]}
  ];

  function esc(value) {
    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  function fmtDate(value, withTime=false) {
    if (!value) return '—';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '—';
    return withTime
      ? d.toLocaleString('ar-OM',{dateStyle:'medium',timeStyle:'short'})
      : d.toLocaleDateString('ar-OM',{dateStyle:'medium'});
  }

  function inputDate(value, withTime=false) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return withTime
      ? local.toISOString().slice(0,16)
      : local.toISOString().slice(0,10);
  }

  function fmtDuration(seconds) {
    seconds = Number(seconds || 0);
    if (!seconds) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return (h ? h+' س ' : '') + m + ' د';
  }

  function status(value) {
    const map = {
      active:['نشط','good'], completed:['مكتمل','good'], published:['منشور','good'],
      graded:['مصحح','good'], present:['حاضر','good'], live:['مباشر','good'],
      draft:['مسودة','warn'], planned:['مخطط','warn'], submitted:['بانتظار التصحيح','warn'],
      late:['متأخر','warn'], scheduled:['مجدول','warn'], paused:['متوقف مؤقتًا','warn'],
      absent:['غائب','bad'], cancelled:['ملغي','bad'], closed:['مغلق','bad'],
      excused:['بعذر','info'], ended:['منتهية','info'], pending_review:['تحتاج تصحيح','warn']
    };
    const item = map[value] || [value || '—','info'];
    return '<span class="instructor-status '+item[1]+'">'+esc(item[0])+'</span>';
  }

  async function api(url, options={}) {
    const response = await fetch(url,{
      ...options,
      credentials:'same-origin',
      headers:{
        ...(options.body ? {'Content-Type':'application/json'} : {}),
        ...(options.headers || {})
      }
    });

    if (response.status === 401 || response.status === 403) {
      if (response.status === 401) {
        localStorage.removeItem('af_user');
        location.replace('/academy/login.html');
      }
    }

    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }

    if (!response.ok) throw new Error(data?.message || 'تعذر تنفيذ العملية');
    return data;
  }

  async function getOptions(force=false) {
    if (!optionsCache || force) {
      optionsCache = await api('/api/instructor/options');
    }
    return optionsCache;
  }

  function toast(message,type='ok') {
    const box = document.getElementById('instructorToast');
    if (!box) return;
    box.textContent = message;
    box.classList.toggle('error',type==='error');
    box.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>box.classList.remove('show'),2600);
  }

  function navHtml() {
    return navGroups.map(group=>{
      const items = group.items.map(item=>{
        const active = item[0]===page ||

  function openForm({title,subtitle='',fields=[],values={},submitLabel='حفظ',onSubmit}) {
    const modal = document.getElementById('instructorModal');
    const form = document.getElementById('instructorModalForm');
    document.getElementById('instructorModalTitle').textContent = title;
    document.getElementById('instructorModalSubtitle').textContent = subtitle;

    form.innerHTML = fields.map(f=>{
      const value = values[f.name] ?? '';
      const cls = f.full ? 'field full' : 'field';

      if (f.type==='select') {
        return '<div class="'+cls+'"><label>'+esc(f.label)+'</label><select name="'+esc(f.name)+'" '+(f.required?'required':'')+'>'+
          (f.placeholder?'<option value="">'+esc(f.placeholder)+'</option>':'')+
          (f.options||[]).map(o=>'<option value="'+esc(o[0])+'" '+(String(o[0])===String(value)?'selected':'')+'>'+esc(o[1])+'</option>').join('')+
          '</select></div>';
      }

      if (f.type==='textarea') {
        return '<div class="'+cls+'"><label>'+esc(f.label)+'</label><textarea name="'+esc(f.name)+'" '+(f.required?'required':'')+'>'+esc(value)+'</textarea></div>';
      }

      if (f.type==='checkbox') {
        return '<label class="instructor-note full"><input name="'+esc(f.name)+'" type="checkbox" '+(value?'checked':'')+'> '+esc(f.label)+'</label>';
      }

      return '<div class="'+cls+'"><label>'+esc(f.label)+'</label><input name="'+esc(f.name)+'" type="'+esc(f.type||'text')+'" value="'+esc(value)+'" '+(f.required?'required':'')+' '+(f.min!==undefined?'min="'+esc(f.min)+'"':'')+' '+(f.max!==undefined?'max="'+esc(f.max)+'"':'')+'></div>';
    }).join('')+
    '<div class="instructor-form-message" id="instructorFormMessage"></div>'+
    '<div class="instructor-form-actions"><button class="btn ghost" id="instructorFormCancel" type="button">إلغاء</button><button class="btn primary" type="submit">'+esc(submitLabel)+'</button></div>';

    modal.hidden=false;
    document.getElementById('instructorFormCancel').onclick=()=>modal.hidden=true;

    form.onsubmit=async e=>{
      e.preventDefault();
      const btn=form.querySelector('button[type="submit"]');
      const msg=document.getElementById('instructorFormMessage');
      const original=btn.textContent;
      const data=Object.fromEntries(new FormData(form).entries());

      fields.filter(f=>f.type==='checkbox').forEach(f=>{
        data[f.name]=form.elements[f.name].checked;
      });

      btn.disabled=true;btn.textContent='جاري الحفظ...';msg.textContent='';
      try{
        await onSubmit(data);
        modal.hidden=true;
      }catch(err){msg.textContent=err.message;}
      finally{btn.disabled=false;btn.textContent=original;}
    };
  }

      const rows=await api('/api/instructor/gradebook');
      target.innerHTML='<section class="instructor-card"><div class="instructor-card-head"><div><h2>دفتر الدرجات</h2><p>أفضل نتائج الاختبارات + الواجبات المصححة.</p></div></div><div class="instructor-table-wrap"><table class="instructor-table"><thead><tr><th>الطالب</th><th>الدورة</th><th>التقدم</th><th>الاختبارات</th><th>الواجبات</th><th>المتوسط</th></tr></thead><tbody>'+
        (rows.length?rows.map(x=>'<tr><td><b>'+esc(x.student?.name||'')+'</b><br><small>'+esc(x.student?.email||'')+'</small></td><td>'+esc(x.course?.title||'')+'</td><td>'+esc(x.progress)+'%</td><td>'+gradeCell(x.quizAverage)+'</td><td>'+gradeCell(x.assignmentAverage)+'</td><td>'+gradeCell(x.academicAverage)+'</td></tr>').join(''):'<tr><td colspan="6" class="instructor-empty">لا توجد درجات حتى الآن.</td></tr>')+
        '</tbody></table></div></section>';
    }catch(err){target.innerHTML='<div class="instructor-card instructor-empty">'+esc(err.message)+'</div>';}
  }

  function gradeCell(value) {
    if (value===null || value===undefined) return '—';
    const cls=value>=80?'good':value>=60?'warn':'bad';
    return '<span class="instructor-grade '+cls+'">'+esc(value)+'%</span>';
  }

  async function renderNotifications() {
    const target=document.getElementById('pageContent');
    const load=async()=>{
      target.innerHTML='<div class="instructor-empty">جاري تحميل الإعلانات...</div>';
      try{
        const rows=await api('/api/instructor/notifications');
        target.innerHTML='<section class="instructor-card"><div class="instructor-card-head"><div><h2>إعلانات الطلاب</h2><p>الإعلان يصل فقط لطلاب الدورة المحددة.</p></div><button class="btn primary" id="notificationAdd" type="button">+ إعلان</button></div><div class="instructor-list">'+
          (rows.length?rows.map(n=>'<div class="instructor-list-row"><div><b>'+esc(n.title)+'</b><span>'+esc(n.courseId?.title||'عام')+' · '+fmtDate(n.sentAt||n.createdAt,true)+'</span><small>'+esc(n.message)+'</small></div>'+status(n.status)+'</div>').join(''):'<div class="instructor-empty">لا توجد إعلانات.</div>')+
          '</div></section>';
        document.getElementById('notificationAdd').onclick=()=>openNotification(load);
      }catch(err){target.innerHTML='<div class="instructor-card instructor-empty">'+esc(err.message)+'</div>';}
    };
    await load();
  }

  async function openNotification(onDone) {
    const opts=await getOptions();
    openForm({
      title:'إعلان جديد',
      subtitle:'سيظهر لطلاب الدورة داخل بوابة الطالب.',
      fields:[
        {name:'courseId',label:'الدورة',type:'select',required:true,placeholder:'اختر الدورة...',options:opts.courses.map(x=>[x._id,x.title])},
        {name:'title',label:'العنوان',required:true},
        {name:'message',label:'الرسالة',type:'textarea',required:true,full:true}
      ],
      submitLabel:'إرسال الإعلان',
      onSubmit:async data=>{
        await api('/api/instructor/notifications',{method:'POST',body:JSON.stringify(data)});
        toast('تم إرسال الإعلان');await onDone();
      }
    });
  }

  async function renderProfile() {
    const target=document.getElementById('pageContent');
    target.innerHTML='<div class="instructor-empty">جاري تحميل الحساب...</div>';
    try{
      const data=await api('/api/instructor/profile');
      target.innerHTML=`
        <section class="instructor-grid-2">
          <article class="instructor-card">
            <div class="instructor-card-head"><div><h2>بيانات المدرب</h2><p>${esc(data.academy?.name||'')}</p></div></div>
            <form id="instructorProfileForm">
              <div class="field"><label>الاسم</label><input name="name" value="${esc(data.user.name||'')}" required></div>
              <div class="field"><label>البريد</label><input value="${esc(data.user.email||'')}" disabled></div>
              <div class="field"><label>الهاتف</label><input name="phone" value="${esc(data.user.phone||'')}"></div>
              <button class="btn primary" type="submit">حفظ البيانات</button>
            </form>
          </article>
          <article class="instructor-card">
            <div class="instructor-card-head"><div><h2>أمان الحساب</h2><p>غيّر كلمة المرور من هنا.</p></div></div>
            <button class="btn secondary" id="instructorPassword" type="button">تغيير كلمة المرور</button>
          </article>
        </section>`;

      document.getElementById('instructorProfileForm').onsubmit=async e=>{
        e.preventDefault();
        const data2=Object.fromEntries(new FormData(e.currentTarget).entries());
        const saved=await api('/api/instructor/profile',{method:'PATCH',body:JSON.stringify(data2)});
        user.name=saved.name;localStorage.setItem('af_user',JSON.stringify(user));toast('تم حفظ البيانات');
      };
      document.getElementById('instructorPassword').onclick=()=>openForm({
        title:'تغيير كلمة المرور',
        fields:[
          {name:'currentPassword',label:'كلمة المرور الحالية',type:'password',required:true},
          {name:'newPassword',label:'كلمة المرور الجديدة',type:'password',required:true}
        ],
        onSubmit:async data2=>{
          await api('/api/instructor/profile/password',{method:'POST',body:JSON.stringify(data2)});
          toast('تم تغيير كلمة المرور');
        }
      });
    }catch(err){target.innerHTML='<div class="instructor-card instructor-empty">'+esc(err.message)+'</div>';}
  }

  async function init() {
    renderShell();

    if (page==='dashboard') return renderDashboard();
    if (page==='courses') return renderCourses();
    if (page==='groups') return renderGroups();
    if (page==='students') return renderStudents();
    if (page==='grades') return renderGrades();
    if (page==='notifications') return renderNotifications();
    if (page==='profile') return renderProfile();

    if (page==='lessons' && window.InstructorTeaching) return window.InstructorTeaching.renderLessons();
    if (page==='attendance' && window.InstructorTeaching) return window.InstructorTeaching.renderAttendance();
    if (page==='assignments' && window.InstructorTeaching) return window.InstructorTeaching.renderAssignments();
    if (page==='live' && window.InstructorLive) return window.InstructorLive.render();

    if (page==='quizzes' && window.AcademyQuizAdmin) return window.AcademyQuizAdmin.renderList();
    if (page==='quiz-builder' && window.AcademyQuizAdmin) return window.AcademyQuizAdmin.renderBuilder();

    document.getElementById('pageContent').innerHTML='<div class="instructor-card instructor-empty">الصفحة غير موجودة.</div>';
  }

  document.addEventListener('DOMContentLoaded',init);

  return {
    api,getOptions,openForm,openDetails,toast,esc,fmtDate,inputDate,fmtDuration,status,progress,user
  };
})();
</script>
</body>
</html>
