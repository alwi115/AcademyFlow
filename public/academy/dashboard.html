<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأكاديمية</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="wrap"><div class="top"><div><span class="badge">Academy Dashboard</span><h1>لوحة الأكاديمية</h1><p class="muted">النسخة التأسيسية: المحاضرات المباشرة + بنية الأكاديمية المستقلة.</p></div></div><div class="grid"><div class="stat"><span class="muted">الدورات</span><strong>—</strong></div><div class="stat"><span class="muted">الطلاب</span><strong>—</strong></div><div class="stat"><span class="muted">المدربين</span><strong>—</strong></div><div class="stat"><span class="muted">المحاضرات</span><strong id="liveCount">0</strong></div></div><section class="panel"><h2>محاضرات Zoom</h2><p class="muted">إذا تم ضبط بيانات Zoom في .env، إنشاء المحاضرة ينشئ اجتماع Zoom تلقائيًا. وإذا ما تم ضبطها، يحفظ الموعد فقط بدون تعطيل بقية النظام.</p><div id="liveRows"></div></section></div><script>const token=localStorage.getItem('af_token');if(!token)location.href='/academy/login.html';fetch('/api/live-sessions',{headers:{Authorization:'Bearer '+token}}).then(async r=>{if(!r.ok)return;const a=await r.json();document.getElementById('liveCount').textContent=a.length;document.getElementById('liveRows').innerHTML=a.map(x=>`<div class="panel"><b>${x.title}</b><div class="muted">${new Date(x.startAt).toLocaleString('ar-OM')}</div>${x.zoomJoinUrl?`<a class="btn" target="_blank" rel="noopener" href="${x.zoomJoinUrl}">دخول Zoom</a>`:''}</div>`).join('')});</script></body></html>
