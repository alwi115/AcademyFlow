<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132e40">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>الامتثال والخصوصية | AcademyFlow</title>
  <style>
/* ===== INLINED FROM /css/app.css ===== */
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --font-display: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;

  --shadow-soft: 0 10px 30px rgba(19, 46, 64, 0.06);
  --shadow-card: 0 8px 24px rgba(19, 46, 64, 0.07);
  --shadow-heavy: 0 18px 52px rgba(19, 46, 64, 0.11);

  --ease: 220ms ease;
}

:root,
html[data-theme='light'] {
  --bg: #f6f8fc;
  --bg-elevated: #ffffff;
  --bg-soft: #eaf0f8;
  --surface: rgba(255,255,255,.94);
  --surface-strong: #ffffff;
  --surface-muted: #f3f6fb;
  --surface-contrast: #132e40;
  --text: #132e40;
  --text-soft: #254758;
  --text-mute: #64758a;
  --line: rgba(19, 46, 64, 0.10);
  --line-strong: rgba(19, 46, 64, 0.17);
  --primary: #3262c8;
  --primary-strong: #244b9b;
  --primary-soft: rgba(50, 98, 200, 0.10);
  --accent: #3262c8;
  --accent-soft: rgba(169, 196, 255, 0.28);
  --success: #23845d;
  --warning: #b67825;
  --danger: #c45151;
  --sidebar: #fbfcff;
  --sidebar-active: rgba(50, 98, 200, 0.10);
  --hero-grad-1: rgba(50,98,200,0.04);
  --hero-grad-2: rgba(169,196,255,0.06);
  --grid-line: rgba(19, 46, 64, 0.025);
}

html[data-theme='dark'] {
  --bg: #101b29;
  --bg-elevated: #122033;
  --bg-soft: #172638;
  --surface: rgba(18, 32, 51, .94);
  --surface-strong: #172638;
  --surface-muted: #19334b;
  --surface-contrast: #f6f8fc;
  --text: #f2f6fb;
  --text-soft: #d5dfec;
  --text-mute: #9aadc2;
  --line: rgba(213, 226, 237, 0.10);
  --line-strong: rgba(213, 226, 237, 0.17);
  --primary: #7aa7ff;
  --primary-strong: #a9c4ff;
  --primary-soft: rgba(122, 167, 255, 0.14);
  --accent: #a9c4ff;
  --accent-soft: rgba(169, 196, 255, 0.14);
  --success: #62c592;
  --warning: #e2a85e;
  --danger: #ef8585;
  --sidebar: #101b29;
  --sidebar-active: rgba(122,167,255,0.13);
  --hero-grad-1: rgba(122,167,255,0.04);
  --hero-grad-2: rgba(169,196,255,0.04);
  --grid-line: rgba(255,255,255,0.025);
  --shadow-soft: 0 12px 34px rgba(0,0,0,.22);
  --shadow-card: 0 10px 28px rgba(0,0,0,.24);
  --shadow-heavy: 0 22px 60px rgba(0,0,0,.32);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  background:
    radial-gradient(circle at 12% 10%, var(--hero-grad-1), transparent 28%),
    radial-gradient(circle at 86% 14%, var(--hero-grad-2), transparent 24%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
  color: var(--text);
  transition: background var(--ease), color var(--ease);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 42px 42px;
  pointer-events: none;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,.22));
}

a { color: inherit; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.h1, h1, h2, h3, h4 {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
}

.page-shell {
  position: relative;
  max-width: 1280px;
  margin: 0 auto;
  padding: 22px 24px 48px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  backdrop-filter: blur(12px);
  border-radius: 22px;
  box-shadow: var(--shadow-soft);
  position: sticky;
  top: 14px;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.brand-badge {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: #fff;
  background: linear-gradient(145deg, var(--primary), var(--primary-strong));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}

.brand-text b {
  display: block;
  font-size: 17px;
}
.brand-text small {
  display: block;
  margin-top: 3px;
  color: var(--text-mute);
  font-size: 11px;
  letter-spacing: .08em;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.nav-links a {
  text-decoration: none;
  color: var(--text-soft);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 14px;
  transition: background var(--ease), color var(--ease);
}
.nav-links a:hover { background: var(--bg-soft); color: var(--text); }

.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.theme-toggle {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text);
  border-radius: 14px;
  display: inline-grid;
  place-items: center;
  box-shadow: var(--shadow-soft);
}

.btn {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  text-decoration: none;
  transition: transform var(--ease), background var(--ease), border-color var(--ease), color var(--ease);
}
.btn:hover { transform: translateY(-1px); }
.btn.primary {
  background: var(--primary);
  color: white;
}
.btn.primary:hover { background: var(--primary-strong); }
.btn.secondary {
  background: var(--bg-elevated);
  border-color: var(--line);
  color: var(--text);
}
.btn.ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text-soft);
}
.btn.soft {
  background: var(--primary-soft);
  color: var(--primary);
}
.btn.wide { width: 100%; }

.hero {
  display: grid;
  grid-template-columns: 1.03fr .97fr;
  gap: 48px;
  align-items: center;
  padding: 72px 6px 44px;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #9a6535;
  font-size: 12px;
  font-weight: 700;
}
html[data-theme='dark'] .kicker { color: #f0c999; }
.kicker::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.hero-copy h1 {
  font-size: clamp(42px, 6vw, 78px);
  line-height: 1.04;
  margin: 18px 0 18px;
}
.hero-copy h1 span { color: var(--primary); }
.hero-copy p {
  margin: 0;
  font-size: 17px;
  line-height: 2;
  color: var(--text-soft);
  max-width: 640px;
}
.hero-metrics {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
}
.hero-metrics article {
  min-width: 142px;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-soft);
}
.hero-metrics strong { display: block; font-size: 22px; margin-bottom: 4px; }
.hero-metrics span { color: var(--text-mute); font-size: 13px; }

.hero-card {
  position: relative;
  padding: 18px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow-heavy);
}
.window-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.window-dots { display: flex; gap: 7px; }
.window-dots span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line-strong);
}
.window-dots span:nth-child(1) { background: var(--primary); }
.window-dots span:nth-child(2) { background: var(--accent); }
.panel-title { font-size: 13px; color: var(--text-mute); }

.dashboard-preview {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 14px;
}
.preview-side {
  padding: 16px 10px;
  border-radius: 20px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.preview-nav {
  display: grid;
  gap: 10px;
}
.preview-nav span {
  height: 34px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
}
.preview-nav span.active {
  background: var(--primary-soft);
  border-color: var(--line);
}
.preview-main {
  display: grid;
  gap: 14px;
}
.preview-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.preview-stats article,
.surface-card {
  padding: 16px;
  border-radius: 18px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.preview-stats article small,
.surface-card small { color: var(--text-mute); display: block; }
.preview-stats article strong { display: block; margin-top: 8px; font-size: 24px; }
.preview-layout {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 12px;
}
.chart {
  min-height: 190px;
  position: relative;
  overflow: hidden;
}
.chart::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to top, transparent 0 38px, var(--line) 39px 40px);
}
.chart svg { position: absolute; inset: 18px 14px 12px; width: calc(100% - 28px); height: calc(100% - 30px); }
.meeting-list { display: grid; gap: 10px; }
.meeting-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.meeting-item i {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 6px var(--primary-soft);
}
.meeting-item b { display: block; font-size: 13px; }
.meeting-item span { color: var(--text-mute); font-size: 12px; }
.floating-note {
  position: absolute;
  left: -14px;
  bottom: 24px;
  padding: 14px 16px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
}
.floating-note b { display: block; margin-bottom: 3px; font-size: 14px; }
.floating-note span { color: var(--text-mute); font-size: 12px; }

.section {
  padding: 42px 0 0;
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.section-head h2 { font-size: clamp(28px, 3vw, 42px); margin: 6px 0 0; }
.section-head p { margin: 0; color: var(--text-soft); max-width: 460px; line-height: 1.9; }

.feature-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.feature-card {
  padding: 22px;
  border-radius: 22px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.feature-card .num {
  width: 40px; height: 40px; border-radius: 14px;
  display: grid; place-items: center;
  background: var(--primary-soft);
  color: var(--primary);
  font-family: var(--font-display);
  font-weight: 800;
  margin-bottom: 18px;
}
.feature-card h3 { margin: 0 0 10px; font-size: 19px; }
.feature-card p { margin: 0; line-height: 1.9; color: var(--text-soft); font-size: 14px; }

.cta-band {
  margin-top: 28px;
  padding: 28px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--bg-elevated), var(--surface-muted));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.cta-band h3 { margin: 0 0 8px; font-size: 28px; }
.cta-band p { margin: 0; color: var(--text-soft); line-height: 1.9; }

.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.auth-card {
  width: min(1080px, 100%);
  display: grid;
  grid-template-columns: 1fr 420px;
  overflow: hidden;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 32px;
  box-shadow: var(--shadow-heavy);
}
.auth-side {
  padding: 40px;
  background: linear-gradient(135deg, var(--surface-muted), transparent);
  border-left: 1px solid var(--line);
}
.auth-side h1 { font-size: clamp(34px, 4vw, 58px); line-height: 1.15; margin: 18px 0 14px; }
.auth-side p { margin: 0; color: var(--text-soft); line-height: 2; max-width: 540px; }
.auth-points {
  display: grid;
  gap: 12px;
  margin-top: 28px;
}
.auth-points article {
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
}
.auth-points strong { display: block; margin-bottom: 5px; }
.auth-points span { color: var(--text-mute); font-size: 13px; }
.auth-form-wrap {
  padding: 34px;
  display: grid;
  align-content: center;
}
.auth-form {
  width: 100%;
}
.auth-form h2 { margin: 16px 0 8px; font-size: 30px; }
.auth-form .lead { margin: 0 0 22px; color: var(--text-soft); line-height: 1.9; }
.field { display: grid; gap: 8px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: var(--text-soft); }
.field input, .field select, .field textarea {
  min-height: 50px;
  padding: 0 14px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: var(--bg-elevated);
  color: var(--text);
  outline: 0;
  transition: border-color var(--ease), background var(--ease);
}
.field textarea { min-height: 120px; padding: 14px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary);
}
.inline-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.note-link { text-decoration: none; color: var(--primary); font-weight: 700; font-size: 13px; }
.form-msg { min-height: 20px; margin-top: 12px; color: var(--danger); font-size: 13px; }

.dashboard-shell {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--sidebar);
  border-left: 1px solid var(--line);
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar .brand { margin-bottom: 28px; }
.side-label {
  color: var(--text-mute);
  font-size: 11px;
  letter-spacing: .12em;
  margin: 16px 12px 10px;
}
.side-nav {
  display: grid;
  gap: 6px;
}
.side-nav a {
  min-height: 46px;
  padding: 0 14px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-soft);
}
.side-nav a.active {
  background: var(--sidebar-active);
  color: var(--text);
  font-weight: 700;
}
.side-icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--bg-soft);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}
.sidebar-foot {
  position: absolute;
  right: 16px;
  left: 16px;
  bottom: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  border-radius: 16px;
  font-size: 12px;
  color: var(--text-soft);
}
.main-content {
  padding: 22px 28px 42px;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 16px;
  margin-bottom: 22px;
}
.page-head p { margin: 8px 0 0; color: var(--text-soft); }
.mobile-toggle { display: none; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.stat-card {
  padding: 20px;
  border-radius: 22px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.stat-card strong { display: block; font-size: 32px; margin-top: 14px; }
.stat-card small { color: var(--text-mute); }

.content-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 14px;
  margin-top: 14px;
}
.card-panel {
  padding: 20px;
  border-radius: 24px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.card-panel h2 { margin: 0; font-size: 20px; }
.card-panel p { color: var(--text-soft); line-height: 1.9; }
.info-list { display: grid; gap: 12px; }
.info-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 14px;
  border-radius: 16px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.info-item b { display: block; margin-bottom: 3px; font-size: 14px; }
.info-item span { color: var(--text-mute); font-size: 12px; }

.table-panel { margin-top: 14px; }
.table-wrap {
  overflow: auto;
  border-radius: 18px;
  border: 1px solid var(--line);
}
.table {
  width: 100%;
  border-collapse: collapse;
  min-width: 640px;
}
.table th, .table td {
  padding: 14px 16px;
  text-align: right;
  border-bottom: 1px solid var(--line);
}
.table th {
  background: var(--surface-muted);
  font-size: 12px;
  color: var(--text-mute);
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--bg-soft); }

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.status::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.status.active { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
.status.trial { color: var(--primary); background: var(--primary-soft); }
.status.frozen, .status.suspended { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.status.grace { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }

.modal[hidden] { display: none !important; }
.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(15, 23, 42, 0.35);
  backdrop-filter: blur(4px);
  padding: 20px;
  z-index: 40;
}
.modal-card {
  width: min(760px, 100%);
  max-height: 92vh;
  overflow: auto;
  padding: 24px;
  border-radius: 28px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-heavy);
}
.modal-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.modal-head p { margin: 6px 0 0; color: var(--text-soft); }
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 14px;
}
.form-grid .span-2 { grid-column: 1 / -1; }
.muted { color: var(--text-mute); }
.empty {
  text-align: center;
  padding: 26px;
  color: var(--text-mute);
}
.note-box {
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--text-soft);
  line-height: 1.8;

  <script>
/* ===== INLINED FROM /js/ui.js ===== */
(function(){
  const THEME_KEY = 'af_theme';
  const DARK = 'dark';
  const LIGHT = 'light';

  function systemTheme(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT;
  }

  function normalizeTheme(value){
    return value === DARK ? DARK : LIGHT;
  }

  function currentTheme(){
    return normalizeTheme(document.documentElement.getAttribute('data-theme') || localStorage.getItem(THEME_KEY) || systemTheme());
  }

  function updateThemeColor(theme){
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', theme === DARK ? '#08111d' : '#f5f7fb');
  }

  function refreshThemeControls(){
    const theme = currentTheme();
    const dark = theme === DARK;

    document.querySelectorAll('[data-theme-label]').forEach(el => {
      el.textContent = dark ? 'الوضع الفاتح' : 'الوضع الداكن';
    });

    document.querySelectorAll('[data-theme-toggle], .theme-toggle').forEach(el => {
      el.setAttribute('aria-pressed', dark ? 'true' : 'false');
      el.setAttribute('aria-label', dark ? 'التحويل إلى الوضع الفاتح' : 'التحويل إلى الوضع الداكن');
      el.title = dark ? 'التحويل إلى الوضع الفاتح' : 'التحويل إلى الوضع الداكن';

      if (el.matches('[data-theme-icon]')) {
        el.textContent = dark ? '☀' : '◐';
      }
    });
  }

  function applyTheme(theme, persist = true){
    const next = normalizeTheme(theme);
    document.documentElement.setAttribute('data-theme', next);

    if(persist) localStorage.setItem(THEME_KEY, next);

    updateThemeColor(next);
    refreshThemeControls();

    window.dispatchEvent(new CustomEvent('academyflow:themechange', {
      detail: { theme: next }
    }));

    return next;
  }

  function toggleTheme(){
    return applyTheme(currentTheme() === DARK ? LIGHT : DARK, true);
  }

  window.toggleTheme = toggleTheme;
  window.setAcademyFlowTheme = applyTheme;
  window.getAcademyFlowTheme = currentTheme;

  applyTheme(localStorage.getItem(THEME_KEY) || systemTheme(), false);

  function toggleSidebar(){
    const sidebar = document.getElementById('sidebar');
    if(!sidebar) return;
    sidebar.classList.toggle('open');
    document.body.classList.toggle('sidebar-open', sidebar.classList.contains('open'));
  }

  function closeSidebar(){
    const sidebar = document.getElementById('sidebar');
    if(!sidebar) return;
    sidebar.classList.remove('open');
    document.body.classList.remove('sidebar-open');
  }

  window.toggleSidebar = toggleSidebar;
  window.closeSidebar = closeSidebar;

  document.addEventListener('DOMContentLoaded', () => {
    refreshThemeControls();

    document.addEventListener('click', event => {
      const themeButton = event.target.closest('[data-theme-toggle], .theme-toggle');
      if(themeButton){
        event.preventDefault();
        toggleTheme();
        return;
      }

      const reloadButton = event.target.closest('[data-reload]');
      if(reloadButton){
        event.preventDefault();
        location.reload();
        return;
      }

      const backButton = event.target.closest('[data-back]');
      if(backButton){
        event.preventDefault();
        history.length > 1 ? history.back() : location.assign('/');
        return;
      }

      const sidebar = document.getElementById('sidebar');
      if(sidebar && sidebar.classList.contains('open') && window.innerWidth <= 860){
        const toggle = event.target.closest('.mobile-toggle');
        if(!sidebar.contains(event.target) && !toggle) closeSidebar();
      }

      const hashLink = event.target.closest('a[href^="#"]');
      if(hashLink){
        const id = hashLink.getAttribute('href');
        if(id && id.length > 1){
          const target = document.querySelector(id);
          if(target){
            event.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', id);
          }
        }
      }
    });

    document.querySelectorAll('.side-nav a').forEach(link => {
      link.addEventListener('click', () => {
        if(window.innerWidth <= 860) closeSidebar();
      });
    });
  });

  window.addEventListener('resize', () => {
    if(window.innerWidth > 860) closeSidebar();
  });

  if(window.matchMedia){
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = event => {
      if(!localStorage.getItem(THEME_KEY)){
        applyTheme(event.matches ? DARK : LIGHT, false);
      }
    };

    if(media.addEventListener) media.addEventListener('change', onSystemChange);
    else if(media.addListener) media.addListener(onSystemChange);
  }
})();
</script>

  async function openModal({title,subtitle='',fields=[],values={},submitLabel='حفظ',onSubmit}) {
    const modal = document.getElementById('saModal');
    const form = document.getElementById('saModalForm');
    document.getElementById('saModalTitle').textContent = title;
    document.getElementById('saModalSubtitle').textContent = subtitle;

    const html = [];
    for (const f of fields) {
      const [name,label,type,required,options,full] = f;
      const req = required ? 'required' : '';
      const cls = full ? 'field full' : 'field';
      const value = values[name] ?? '';

      if (type === 'textarea') {
        html.push('<div class="'+cls+'"><label>'+esc(label)+'</label><textarea name="'+esc(name)+'" '+req+'>'+esc(value)+'</textarea></div>');
      } else if (type === 'select') {
        html.push('<div class="'+cls+'"><label>'+esc(label)+'</label><select name="'+esc(name)+'" '+req+'>'+
          (required ? '' : '<option value="">بدون</option>')+
          (options || []).map(o => '<option value="'+esc(o[0])+'" '+(String(o[0]) === String(value) ? 'selected' : '')+'>'+esc(o[1])+'</option>').join('')+
          '</select></div>');
      } else if (type === 'checkbox') {
        html.push('<div class="full sa-switch-row"><span><b>'+esc(label)+'</b><span>'+esc(options || '')+'</span></span><label class="sa-switch"><input name="'+esc(name)+'" type="checkbox" '+(value ? 'checked' : '')+'><i></i></label></div>');
      } else {
        html.push('<div class="'+cls+'"><label>'+esc(label)+'</label><input name="'+esc(name)+'" type="'+esc(type)+'" value="'+esc(value)+'" '+req+'></div>');
      }
    }

    html.push('<div class="sa-form-message" id="saFormMessage"></div>');
    html.push('<div class="sa-form-actions"><button class="btn ghost" id="saModalCancel" type="button">إلغاء</button><button class="btn primary" type="submit">'+esc(submitLabel)+'</button></div>');
    form.innerHTML = html.join('');

    modal.hidden = false;
    document.getElementById('saModalCancel').onclick = () => modal.hidden = true;

    form.onsubmit = async e => {
      e.preventDefault();

      const submit = form.querySelector('button[type="submit"]');
      const original = submit.textContent;
      const message = document.getElementById('saFormMessage');
      submit.disabled = true;
      submit.textContent = 'جاري الحفظ...';
      message.textContent = '';

      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());

      fields.filter(f => f[2] === 'checkbox').forEach(f => {
        data[f[0]] = form.elements[f[0]].checked;
      });

      for (const key of Object.keys(data)) {
        if (data[key] === '') delete data[key];
      }

      try {
        await onSubmit(data);
        modal.hidden = true;
      } catch (err) {
        message.textContent = err.message;
      } finally {
        submit.disabled = false;
        submit.textContent = original;
      }
    };
  }

  function uptime(seconds) {
    seconds = Number(seconds || 0);
    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    return (days ? days+' يوم ' : '')+(hours ? hours+' س ' : '')+minutes+' د';
  }

  function fmtBytes(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n < 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

            const expected = 'RESTORE '+id;
            const confirmation = prompt(
              'تحذير: سيتم استبدال بيانات قاعدة البيانات بهذه النسخة.\n' +
              'سيتم إنشاء Safety Backup تلقائيًا قبل التنفيذ.\n\n' +

            );

            if (confirmation !== expected) {
              if (confirmation !== null) toast('تم إلغاء الاسترجاع: نص التأكيد غير مطابق','error');
              return;
            }

            if (!confirm('تأكيد أخير: هل تريد تنفيذ Restore الآن؟')) return;

            button.disabled = true;
            try {
              const result = await api('/api/superadmin/backups/'+encodeURIComponent(id)+'/restore',{

              toast(err.message,'error');
            } finally {
              button.disabled = false;
            }
          };
        });
      } catch (err) {
        document.getElementById('healthRows').innerHTML = '<div class="sa-empty">'+esc(err.message)+'</div>';

      box.style.display = 'block';
      box.textContent = message;
      box.classList.toggle('sa-danger-note', type === 'error');
    };

    target.addEventListener('click', async event => {
      const actionButton = event.target.closest('[data-action]');
      if (!actionButton || !target.contains(actionButton)) return;

      const action = actionButton.dataset.action;

      if (action === 'refresh-health') {
        event.preventDefault();
        actionButton.disabled = true;
        actionButton.textContent = 'جاري الفحص...';
        try {
          await api('/api/superadmin/health/run',{method:'POST'});
          toast('تم تشغيل فحص المراقبة');
          await load();
        } catch (err) {
          toast(err.message,'error');
        } finally {
          actionButton.disabled = false;
          actionButton.textContent = 'فحص الآن';
        }
        return;
      }

      if (action !== 'create-backup') return;

      event.preventDefault();
      if (actionButton.disabled) return;

      actionButton.disabled = true;
      actionButton.setAttribute('aria-busy', 'true');
      actionButton.textContent = 'جاري إنشاء النسخة...';
      setBackupStatus('بدأ إنشاء النسخة الاحتياطية. لا تغلق الصفحة حتى تظهر النتيجة.');

      try {
        const result = await api('/api/superadmin/backups',{method:'POST'});
        setBackupStatus('تم إنشاء النسخة بنجاح: ' + (result?.id || 'Backup جديد'));

        setBackupStatus('فشل إنشاء النسخة: ' + err.message, 'error');
        toast(err.message,'error');
      } finally {
        actionButton.disabled = false;
        actionButton.removeAttribute('aria-busy');
        actionButton.textContent = 'إنشاء Backup الآن';
      }
    });

    await load();
  }

    `;

    const typeLabels = {
      access: 'نسخة من البيانات',
      correction: 'تصحيح / تحديث',
      deletion: 'حذف البيانات',
      portability: 'نقل البيانات',
      objection: 'اعتراض',
      withdraw_consent: 'سحب الموافقة',
      stop_notifications: 'إيقاف الإشعارات الإلكترونية',
      complaint: 'شكوى خصوصية'
    };

    const statusLabelsLocal = {
      received: 'مستلم',
      verifying: 'تحقق',
      in_progress: 'قيد التنفيذ',
      completed: 'مكتمل',
      rejected: 'مرفوض'
    };

    let rows = [];

    const draw = () => {
      const filter = document.getElementById('privacyStatusFilter').value;
      const shown = filter ? rows.filter(x => x.status === filter) : rows;

      document.getElementById('privacyRows').innerHTML = `
        <div class="sa-table-wrap">
          <table class="sa-table">
            <thead><tr><th>الطلب</th><th>صاحب الطلب</th><th>النوع</th><th>الحالة</th><th>التحقق</th><th>التاريخ</th><th></th></tr></thead>
            <tbody>
              ${shown.length ? shown.map(x => `
                <tr>
                  <td class="sa-row-title"><b>${esc(x.requestNumber)}</b><small>${esc(x.academyCode || 'بدون كود')}</small></td>
                  <td><b>${esc(x.name)}</b><small style="display:block;color:var(--text-mute)">${esc(x.email)}</small></td>
                  <td>${esc(typeLabels[x.type] || x.type)}</td>
                  <td><span class="sa-status ${x.status === 'completed' ? 'good' : x.status === 'rejected' ? 'bad' : 'warn'}">${esc(statusLabelsLocal[x.status] || x.status)}</span></td>
                  <td>${x.identityVerified ? '<span class="sa-status good">تم</span>' : '<span class="sa-status warn">مطلوب</span>'}</td>
                  <td>${fmtDate(x.createdAt,true)}</td>
                  <td><button class="btn ghost privacy-open" data-id="${esc(x._id)}" type="button">مراجعة</button></td>
                </tr>
              `).join('') : '<tr><td colspan="7" class="sa-empty">لا توجد طلبات بهذه الحالة.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;

      document.querySelectorAll('.privacy-open').forEach(button => {
        button.onclick = async () => {
          const row = rows.find(x => x._id === button.dataset.id);
          if (!row) return;

          await openModal({
            title: 'طلب '+row.requestNumber,
            subtitle: (typeLabels[row.type] || row.type)+' · '+row.email,
            values: {
              status: row.status,
              identityVerified: row.identityVerified,
              internalNote: row.internalNote || ''
            },
            fields: [
              ['status','الحالة','select',true,[
                ['received','مستلم'],
                ['verifying','تحقق من الهوية'],
                ['in_progress','قيد التنفيذ'],
                ['completed','مكتمل'],
                ['rejected','مرفوض']
              ]],
              ['identityVerified','تم التحقق من الهوية','checkbox',false,'لا تنفذ طلب الوصول أو الحذف قبل التحقق المناسب.',true],
              ['internalNote','ملاحظات داخلية','textarea',false,null,true]
            ],
            submitLabel: 'حفظ حالة الطلب',
            onSubmit: async data => {
              data.identityVerified = Boolean(data.identityVerified);
              await api('/api/superadmin/privacy-requests/'+encodeURIComponent(row._id),{
                method:'PATCH',
                body:JSON.stringify(data)
              });
              toast('تم تحديث طلب الخصوصية');
              await load();
            }
          });
        };
      });
    };

    const load = async () => {
      try {
        rows = await api('/api/superadmin/privacy-requests');
        draw();
      } catch (err) {
        document.getElementById('privacyRows').innerHTML = '<div class="sa-empty">'+esc(err.message)+'</div>';
      }
    };

    document.getElementById('privacyStatusFilter').onchange = draw;
    document.getElementById('privacyRefresh').onclick = load;
    await load();
  }

  async function renderCompliance() {
    const target = document.getElementById('saPageContent');
    target.innerHTML = `
      <div class="sa-grid-2">
        <section class="sa-card">
          <div class="sa-card-head">
            <div>
              <h2>سجل أنشطة معالجة البيانات</h2>
              <p>سجل تشغيلي مستمر لفئات البيانات والأغراض والاحتفاظ والمستلمين والتحويلات والضوابط.</p>
            </div>
            <button class="btn secondary" id="processingRefresh" type="button">تحديث</button>
          </div>
          <div id="processingRows"><div class="sa-empty">جاري التحميل...</div></div>
        </section>

        <section class="sa-card">
          <div class="sa-card-head">
            <div>
              <h2>سجل حوادث البيانات</h2>
              <p>وثّق أي اختراق أو وصول غير مصرح به، وراقب مهلة 72 ساعة عندما تنطبق.</p>
            </div>
            <button class="btn primary" id="incidentCreate" type="button">تسجيل حادث</button>
          </div>
          <div id="incidentRows"><div class="sa-empty">جاري التحميل...</div></div>
        </section>
      </div>
    `;

    let activities = [];
    let incidents = [];

    const incidentDeadline = row => {
      if (!row.detectedAt || (!row.rightsRisk && !row.highRiskToSubjects)) return '—';
      const deadline = new Date(new Date(row.detectedAt).getTime() + 72 * 60 * 60 * 1000);
      const overdue =
        Date.now() > deadline.getTime() &&
        (
          (row.authorityNotificationRequired && !row.authorityNotifiedAt) ||
          (row.subjectsNotificationRequired && !row.subjectsNotifiedAt)
        );
      return (overdue ? 'متأخر · ' : '') + fmtDate(deadline,true);
    };

    const drawActivities = () => {
      document.getElementById('processingRows').innerHTML = `
        <div class="sa-table-wrap">
          <table class="sa-table">
            <thead><tr><th>النشاط</th><th>الغرض</th><th>الاحتفاظ</th><th>المستلمون / النقل</th><th>آخر مراجعة</th><th></th></tr></thead>
            <tbody>
              ${activities.length ? activities.map(x => `
                <tr>
                  <td class="sa-row-title"><b>${esc(x.name)}</b><small>${esc((x.dataCategories || []).join('، '))}</small></td>
                  <td>${esc(x.purpose)}</td>
                  <td>${esc(x.retentionPeriod)}</td>
                  <td><small style="display:block">${esc((x.recipients || []).join('، ') || '—')}</small><small style="display:block;color:var(--text-mute)">${esc((x.transferDestinations || []).join('، ') || 'بدون تحويل مسجل')}</small></td>
                  <td>${fmtDate(x.lastReviewedAt,true)}</td>
                  <td><button class="btn ghost processing-review" data-id="${esc(x._id)}" type="button">تأكيد المراجعة</button></td>
                </tr>
              `).join('') : '<tr><td colspan="6" class="sa-empty">لا توجد أنشطة مسجلة.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;

      document.querySelectorAll('.processing-review').forEach(button => {
        button.onclick = async () => {
          button.disabled = true;
          try {
            await api('/api/superadmin/compliance/processing-activities/'+encodeURIComponent(button.dataset.id)+'/review',{method:'POST'});
            toast('تم تسجيل مراجعة نشاط المعالجة');
            await loadActivities();
          } catch (err) {
            toast(err.message,'error');
          } finally {
            button.disabled = false;
          }
        };
      });
    };

    const drawIncidents = () => {
      document.getElementById('incidentRows').innerHTML = `
        <div class="sa-table-wrap">
          <table class="sa-table">
            <thead><tr><th>الحادث</th><th>الخطر</th><th>الحالة</th><th>مهلة 72 ساعة</th><th>الإخطارات</th><th></th></tr></thead>
            <tbody>
              ${incidents.length ? incidents.map(x => `
                <tr>
                  <td class="sa-row-title"><b>${esc(x.incidentNumber)}</b><small>${esc(x.title)}</small></td>
                  <td><span class="sa-status ${['high','critical'].includes(x.riskLevel) ? 'bad' : x.riskLevel === 'medium' ? 'warn' : 'info'}">${esc(x.riskLevel)}</span></td>
                  <td>${esc(x.status)}</td>
                  <td>${esc(incidentDeadline(x))}</td>
                  <td><small style="display:block">الجهة: ${x.authorityNotifiedAt ? fmtDate(x.authorityNotifiedAt,true) : x.authorityNotificationRequired ? 'مطلوب' : 'غير مطلوب'}</small><small style="display:block;color:var(--text-mute)">الأشخاص: ${x.subjectsNotifiedAt ? fmtDate(x.subjectsNotifiedAt,true) : x.subjectsNotificationRequired ? 'مطلوب' : 'غير مطلوب'}</small></td>
                  <td><button class="btn ghost incident-open" data-id="${esc(x._id)}" type="button">تحديث</button></td>
                </tr>
              `).join('') : '<tr><td colspan="6" class="sa-empty">لا توجد حوادث بيانات مسجلة.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;

      document.querySelectorAll('.incident-open').forEach(button => {
        button.onclick = async () => {
          const row = incidents.find(x => x._id === button.dataset.id);
          if (!row) return;

          await openModal({
            title: row.incidentNumber+' · '+row.title,
            subtitle: 'تم اكتشافه '+fmtDate(row.detectedAt,true),
            values: {
              status: row.status,
              riskLevel: row.riskLevel,
              rightsRisk: row.rightsRisk,
              highRiskToSubjects: row.highRiskToSubjects,
              authorityNotificationRequired: row.authorityNotificationRequired,
              subjectsNotificationRequired: row.subjectsNotificationRequired,
              authorityNotifiedAt: row.authorityNotifiedAt ? String(row.authorityNotifiedAt).slice(0,16) : '',
              subjectsNotifiedAt: row.subjectsNotifiedAt ? String(row.subjectsNotifiedAt).slice(0,16) : '',
              containmentActions: row.containmentActions || '',
              correctiveActions: row.correctiveActions || ''
            },
            fields: [
              ['status','الحالة','select',true,[['open','مفتوح'],['contained','تم الاحتواء'],['closed','مغلق']]],
              ['riskLevel','مستوى الخطر','select',true,[['low','منخفض'],['medium','متوسط'],['high','عالٍ'],['critical','حرج']]],
              ['rightsRisk','يوجد خطر على حقوق أصحاب البيانات','checkbox',false,'قد يتطلب إخطار الجهة المختصة خلال 72 ساعة.',true],
              ['highRiskToSubjects','قد يسبب ضررًا جسيمًا أو مخاطر عالية','checkbox',false,'قد يتطلب إخطار أصحاب البيانات خلال 72 ساعة.',true],
              ['authorityNotificationRequired','إخطار الجهة المختصة مطلوب','checkbox',false,'سجّل وقت الإخطار بعد تنفيذه.',true],
              ['subjectsNotificationRequired','إخطار أصحاب البيانات مطلوب','checkbox',false,'سجّل وقت الإخطار بعد تنفيذه.',true],
              ['authorityNotifiedAt','وقت إخطار الجهة المختصة','datetime-local',false],
              ['subjectsNotifiedAt','وقت إخطار أصحاب البيانات','datetime-local',false],
              ['containmentActions','إجراءات الاحتواء','textarea',false,null,true],
              ['correctiveActions','الإجراءات التصحيحية','textarea',false,null,true]
            ],
            submitLabel: 'حفظ سجل الحادث',
            onSubmit: async data => {
              ['rightsRisk','highRiskToSubjects','authorityNotificationRequired','subjectsNotificationRequired']
                .forEach(key => data[key] = Boolean(data[key]));
              await api('/api/superadmin/compliance/incidents/'+encodeURIComponent(row._id),{
                method:'PATCH',
                body:JSON.stringify(data)
              });
              toast('تم تحديث سجل الحادث');
              await loadIncidents();
            }
          });
        };
      });
    };

    const loadActivities = async () => {
      activities = await api('/api/superadmin/compliance/processing-activities');
      drawActivities();
    };

    const loadIncidents = async () => {
      incidents = await api('/api/superadmin/compliance/incidents');
      drawIncidents();
    };

    document.getElementById('processingRefresh').onclick = async () => {
      try { await loadActivities(); } catch (err) { toast(err.message,'error'); }
    };

    document.getElementById('incidentCreate').onclick = async () => {
      await openModal({
        title: 'تسجيل حادث بيانات',
        subtitle: 'سجّل الواقعة فور العلم بها. لا تنتظر اكتمال التحقيق لبدء التوثيق.',
        values: {
          detectedAt: new Date().toISOString().slice(0,16),
          riskLevel: 'medium'
        },
        fields: [
          ['title','عنوان مختصر','text',true],
          ['detectedAt','وقت الاكتشاف','datetime-local',true],
          ['occurredAt','وقت وقوع الحادث إن عُرف','datetime-local',false],
          ['riskLevel','مستوى الخطر الأولي','select',true,[['low','منخفض'],['medium','متوسط'],['high','عالٍ'],['critical','حرج']]],
          ['affectedSubjectsEstimate','عدد أصحاب البيانات التقريبي','number',false],
          ['rightsRisk','قد يهدد حقوق أصحاب البيانات','checkbox',false,'قد تبدأ مهلة إخطار 72 ساعة للجهة المختصة.',true],
          ['highRiskToSubjects','قد يسبب ضررًا جسيمًا أو مخاطر عالية','checkbox',false,'قد يتطلب إخطار أصحاب البيانات خلال 72 ساعة.',true],
          ['authorityNotificationRequired','إخطار الجهة المختصة مطلوب','checkbox',false,'حدد وفق تقييم الواقعة والقانون.',true],
          ['subjectsNotificationRequired','إخطار أصحاب البيانات مطلوب','checkbox',false,'حدد وفق تقييم الواقعة والقانون.',true],
          ['dataCategories','فئات البيانات المتأثرة (سطر لكل فئة)','textarea',false,null,true],
          ['description','وصف الحادث','textarea',true,null,true],
          ['containmentActions','إجراءات الاحتواء الأولية','textarea',false,null,true],
          ['correctiveActions','الإجراءات التصحيحية المخططة','textarea',false,null,true]
        ],
        submitLabel: 'إنشاء سجل الحادث',
        onSubmit: async data => {
          ['rightsRisk','highRiskToSubjects','authorityNotificationRequired','subjectsNotificationRequired']
            .forEach(key => data[key] = Boolean(data[key]));
          await api('/api/superadmin/compliance/incidents',{
            method:'POST',
            body:JSON.stringify(data)
          });
          toast('تم إنشاء سجل الحادث');
          await loadIncidents();
        }
      });
    };

    try {
      await Promise.all([loadActivities(),loadIncidents()]);
    } catch (err) {
      toast(err.message,'error');
    }
  }

  async function renderSettings() {
    const target = document.getElementById('saPageContent');
    target.innerHTML = '<div class="sa-empty">جاري تحميل الإعدادات...</div>';

    try {
      const s = await api('/api/superadmin/settings');

      target.innerHTML = `
        <form id="saSettingsForm">
          <div class="sa-settings-grid">
            <section class="sa-settings-block">
              <h3>الإعدادات العامة</h3>
              <div class="field"><label>اسم المنصة</label><input name="platformName" value="${esc(s.platformName || 'AcademyFlow')}"></div>
              <div class="field"><label>العملة الافتراضية</label><input name="defaultCurrency" value="${esc(s.defaultCurrency || 'OMR')}"></div>
              <div class="field"><label>مدة التجربة الافتراضية بالأيام</label><input name="defaultTrialDays" type="number" min="0" max="365" value="${esc(s.defaultTrialDays ?? 15)}"></div>
              <div class="field"><label>فترة السماح بالأيام</label><input name="defaultGraceDays" type="number" min="0" max="90" value="${esc(s.defaultGraceDays ?? 5)}"></div>
            </section>

            <section class="sa-settings-block">
              <h3>الدعم والتنبيهات</h3>
              <div class="field"><label>بريد الدعم</label><input name="supportEmail" type="email" value="${esc(s.supportEmail || '')}"></div>
              <div class="field"><label>رقم الدعم</label><input name="supportPhone" value="${esc(s.supportPhone || '')}"></div>
              <div class="field"><label>إعلان عام</label><textarea name="announcement">${esc(s.announcement || '')}</textarea></div>
              <div class="sa-switch-row">
                <span><b>وضع الصيانة</b><span>يحفظ حالة الصيانة في إعدادات المنصة لاستخدامها عند ربط بوابة الصيانة.</span></span>
                <label class="sa-switch"><input name="maintenanceMode" type="checkbox" ${s.maintenanceMode ? 'checked' : ''}><i></i></label>
              </div>
            </section>
          </div>

          <section class="sa-card sa-section" style="box-shadow:none">
            <div class="sa-card-head">
              <div>
                <h2>الهوية القانونية والتجارية</h2>
                <p>تظهر هذه البيانات في السياسات العامة. لا تضع أرقامًا غير حقيقية.</p>
              </div>
            </div>
            <div class="sa-settings-grid">
              <section class="sa-settings-block">
                <h3>بيانات المنشأة</h3>
                <div class="field"><label>الاسم القانوني للمنشأة</label><input name="legalEntityName" value="${esc(s.legalEntityName || '')}" placeholder="الاسم كما يظهر في السجل التجاري"></div>
                <div class="field"><label>رقم السجل التجاري</label><input name="commercialRegistrationNumber" value="${esc(s.commercialRegistrationNumber || '')}"></div>
                <div class="field"><label>رقم ترخيص/تصريح التجارة الإلكترونية (إن كان مطبقًا)</label><input name="ecommerceLicenseNumber" value="${esc(s.ecommerceLicenseNumber || '')}"></div>
                <div class="field"><label>الرقم الضريبي (إن وجد)</label><input name="taxNumber" value="${esc(s.taxNumber || '')}"></div>
                <div class="field"><label>عنوان النشاط</label><textarea name="businessAddress">${esc(s.businessAddress || '')}</textarea></div>
              </section>
              <section class="sa-settings-block">
                <h3>حماية البيانات</h3>
                <div class="field"><label>اسم مسؤول حماية البيانات / الخصوصية</label><input name="privacyOfficerName" value="${esc(s.privacyOfficerName || '')}"></div>
                <div class="field"><label>بريد مسؤول حماية البيانات / الخصوصية</label><input name="privacyOfficerEmail" type="email" value="${esc(s.privacyOfficerEmail || '')}"></div>
                <div class="sa-note">يُستخدم هذا البريد في سياسة الخصوصية وطلبات أصحاب البيانات. يفضّل بريدًا وظيفيًا مستقلًا عن البريد الشخصي.</div>
              </section>
            </div>
          </section>

          <div class="sa-card sa-section">
            <div class="sa-card-head">
              <div><h2>حفظ التغييرات</h2><p>التجربة وفترة السماح الجديدة تطبق على الأكاديميات التي يتم إنشاؤها بعد الحفظ.</p></div>
              <button class="btn primary" type="submit">حفظ الإعدادات</button>
            </div>
            <div id="settingsMessage" class="sa-note">آخر تحديث: ${fmtDate(s.updatedAt,true)}</div>
          </div>
        </form>
      `;

      document.getElementById('saSettingsForm').onsubmit = async e => {
        e.preventDefault();
        const form = e.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        const original = button.textContent;
        button.disabled = true;
        button.textContent = 'جاري الحفظ...';

        const data = Object.fromEntries(new FormData(form).entries());
        data.maintenanceMode = form.elements.maintenanceMode.checked;

        try {
          const saved = await api('/api/superadmin/settings',{method:'PATCH',body:JSON.stringify(data)});
          document.getElementById('settingsMessage').textContent = 'تم الحفظ بنجاح · '+fmtDate(saved.updatedAt,true);
          toast('تم حفظ إعدادات المنصة');
        } catch (err) {
          toast(err.message,'error');
        } finally {
          button.disabled = false;
          button.textContent = original;
        }
      };
    } catch (err) {
      target.innerHTML = '<div class="sa-card sa-empty">'+esc(err.message)+'</div>';
    }
  }

  async function init() {
    renderShell();

    if (page === 'dashboard') return renderDashboard();
    if (page === 'academies') return renderAcademies();
    if (page === 'plans') return renderPlans();
    if (page === 'subscriptions') return renderSubscriptions();
    if (page === 'health') return renderHealth();
    if (page === 'audit') return renderAudit();
    if (page === 'privacy') return renderPrivacy();
    if (page === 'compliance') return renderCompliance();
    if (page === 'settings') return renderSettings();

    document.getElementById('saPageContent').innerHTML = '<div class="sa-card sa-empty">الصفحة غير موجودة.</div>';
  }

  document.addEventListener('DOMContentLoaded',init);
  return { api };
})();
</script>
</body>
</html>
