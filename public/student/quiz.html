<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132e40">
  <meta name="color-scheme" content="light dark">
  <title>حل الاختبار | AcademyFlow</title>
  <style>
/* ===== INLINED FROM /css/app.css ===== */
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --font-display: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;

  --shadow-soft: 0 10px 30px rgba(19, 46, 64, 0.06);
  --shadow-card: 0 8px 24px rgba(19, 46, 64, 0.07);
  --shadow-heavy: 0 18px 52px rgba(19, 46, 64, 0.11);

  --ease: 220ms ease;
}

:root,
html[data-theme='light'] {
  --bg: #f6f8fc;
  --bg-elevated: #ffffff;
  --bg-soft: #eaf0f8;
  --surface: rgba(255,255,255,.94);
  --surface-strong: #ffffff;
  --surface-muted: #f3f6fb;
  --surface-contrast: #132e40;
  --text: #132e40;
  --text-soft: #254758;
  --text-mute: #64758a;
  --line: rgba(19, 46, 64, 0.10);
  --line-strong: rgba(19, 46, 64, 0.17);
  --primary: #3262c8;
  --primary-strong: #244b9b;
  --primary-soft: rgba(50, 98, 200, 0.10);
  --accent: #3262c8;
  --accent-soft: rgba(169, 196, 255, 0.28);
  --success: #23845d;
  --warning: #b67825;
  --danger: #c45151;
  --sidebar: #fbfcff;
  --sidebar-active: rgba(50, 98, 200, 0.10);
  --hero-grad-1: rgba(50,98,200,0.04);
  --hero-grad-2: rgba(169,196,255,0.06);
  --grid-line: rgba(19, 46, 64, 0.025);
}

html[data-theme='dark'] {
  --bg: #101b29;
  --bg-elevated: #122033;
  --bg-soft: #172638;
  --surface: rgba(18, 32, 51, .94);
  --surface-strong: #172638;
  --surface-muted: #19334b;
  --surface-contrast: #f6f8fc;
  --text: #f2f6fb;
  --text-soft: #d5dfec;
  --text-mute: #9aadc2;
  --line: rgba(213, 226, 237, 0.10);
  --line-strong: rgba(213, 226, 237, 0.17);
  --primary: #7aa7ff;
  --primary-strong: #a9c4ff;
  --primary-soft: rgba(122, 167, 255, 0.14);
  --accent: #a9c4ff;
  --accent-soft: rgba(169, 196, 255, 0.14);
  --success: #62c592;
  --warning: #e2a85e;
  --danger: #ef8585;
  --sidebar: #101b29;
  --sidebar-active: rgba(122,167,255,0.13);
  --hero-grad-1: rgba(122,167,255,0.04);
  --hero-grad-2: rgba(169,196,255,0.04);
  --grid-line: rgba(255,255,255,0.025);
  --shadow-soft: 0 12px 34px rgba(0,0,0,.22);
  --shadow-card: 0 10px 28px rgba(0,0,0,.24);
  --shadow-heavy: 0 22px 60px rgba(0,0,0,.32);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  background:
    radial-gradient(circle at 12% 10%, var(--hero-grad-1), transparent 28%),
    radial-gradient(circle at 86% 14%, var(--hero-grad-2), transparent 24%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
  color: var(--text);
  transition: background var(--ease), color var(--ease);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 42px 42px;
  pointer-events: none;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,.22));
}

a { color: inherit; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.h1, h1, h2, h3, h4 {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
}

.page-shell {
  position: relative;
  max-width: 1280px;
  margin: 0 auto;
  padding: 22px 24px 48px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  backdrop-filter: blur(12px);
  border-radius: 22px;
  box-shadow: var(--shadow-soft);
  position: sticky;
  top: 14px;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.brand-badge {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: #fff;
  background: linear-gradient(145deg, var(--primary), var(--primary-strong));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}

.brand-text b {
  display: block;
  font-size: 17px;
}
.brand-text small {
  display: block;
  margin-top: 3px;
  color: var(--text-mute);
  font-size: 11px;
  letter-spacing: .08em;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.nav-links a {
  text-decoration: none;
  color: var(--text-soft);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 14px;
  transition: background var(--ease), color var(--ease);
}
.nav-links a:hover { background: var(--bg-soft); color: var(--text); }

.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.theme-toggle {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text);
  border-radius: 14px;
  display: inline-grid;
  place-items: center;
  box-shadow: var(--shadow-soft);
}

.btn {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  text-decoration: none;
  transition: transform var(--ease), background var(--ease), border-color var(--ease), color var(--ease);
}
.btn:hover { transform: translateY(-1px); }
.btn.primary {
  background: var(--primary);
  color: white;
}
.btn.primary:hover { background: var(--primary-strong); }
.btn.secondary {
  background: var(--bg-elevated);
  border-color: var(--line);
  color: var(--text);
}
.btn.ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text-soft);
}
.btn.soft {
  background: var(--primary-soft);
  color: var(--primary);
}
.btn.wide { width: 100%; }

.hero {
  display: grid;
  grid-template-columns: 1.03fr .97fr;
  gap: 48px;
  align-items: center;
  padding: 72px 6px 44px;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #9a6535;
  font-size: 12px;
  font-weight: 700;
}
html[data-theme='dark'] .kicker { color: #f0c999; }
.kicker::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.hero-copy h1 {
  font-size: clamp(42px, 6vw, 78px);
  line-height: 1.04;
  margin: 18px 0 18px;
}
.hero-copy h1 span { color: var(--primary); }
.hero-copy p {
  margin: 0;
  font-size: 17px;
  line-height: 2;
  color: var(--text-soft);
  max-width: 640px;
}
.hero-metrics {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
}
.hero-metrics article {
  min-width: 142px;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-soft);
}
.hero-metrics strong { display: block; font-size: 22px; margin-bottom: 4px; }
.hero-metrics span { color: var(--text-mute); font-size: 13px; }

.hero-card {
  position: relative;
  padding: 18px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow-heavy);
}
.window-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.window-dots { display: flex; gap: 7px; }
.window-dots span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line-strong);
}
.window-dots span:nth-child(1) { background: var(--primary); }
.window-dots span:nth-child(2) { background: var(--accent); }
.panel-title { font-size: 13px; color: var(--text-mute); }

.dashboard-preview {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 14px;
}
.preview-side {
  padding: 16px 10px;
  border-radius: 20px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.preview-nav {
  display: grid;
  gap: 10px;
}
.preview-nav span {
  height: 34px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
}
.preview-nav span.active {
  background: var(--primary-soft);
  border-color: var(--line);
}
.preview-main {
  display: grid;
  gap: 14px;
}
.preview-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.preview-stats article,
.surface-card {
  padding: 16px;
  border-radius: 18px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.preview-stats article small,
.surface-card small { color: var(--text-mute); display: block; }
.preview-stats article strong { display: block; margin-top: 8px; font-size: 24px; }
.preview-layout {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 12px;
}
.chart {
  min-height: 190px;
  position: relative;
  overflow: hidden;
}
.chart::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to top, transparent 0 38px, var(--line) 39px 40px);
}
.chart svg { position: absolute; inset: 18px 14px 12px; width: calc(100% - 28px); height: calc(100% - 30px); }
.meeting-list { display: grid; gap: 10px; }
.meeting-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.meeting-item i {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 6px var(--primary-soft);
}
.meeting-item b { display: block; font-size: 13px; }
.meeting-item span { color: var(--text-mute); font-size: 12px; }
.floating-note {
  position: absolute;
  left: -14px;
  bottom: 24px;
  padding: 14px 16px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
}
.floating-note b { display: block; margin-bottom: 3px; font-size: 14px; }
.floating-note span { color: var(--text-mute); font-size: 12px; }

.section {
  padding: 42px 0 0;
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.section-head h2 { font-size: clamp(28px, 3vw, 42px); margin: 6px 0 0; }
.section-head p { margin: 0; color: var(--text-soft); max-width: 460px; line-height: 1.9; }

.feature-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.feature-card {
  padding: 22px;
  border-radius: 22px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.feature-card .num {
  width: 40px; height: 40px; border-radius: 14px;
  display: grid; place-items: center;
  background: var(--primary-soft);
  color: var(--primary);
  font-family: var(--font-display);
  font-weight: 800;
  margin-bottom: 18px;
}
.feature-card h3 { margin: 0 0 10px; font-size: 19px; }
.feature-card p { margin: 0; line-height: 1.9; color: var(--text-soft); font-size: 14px; }

.cta-band {
  margin-top: 28px;
  padding: 28px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--bg-elevated), var(--surface-muted));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.cta-band h3 { margin: 0 0 8px; font-size: 28px; }
.cta-band p { margin: 0; color: var(--text-soft); line-height: 1.9; }

.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.auth-card {
  width: min(1080px, 100%);
  display: grid;
  grid-template-columns: 1fr 420px;
  overflow: hidden;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 32px;
  box-shadow: var(--shadow-heavy);
}
.auth-side {
  padding: 40px;
  background: linear-gradient(135deg, var(--surface-muted), transparent);
  border-left: 1px solid var(--line);
}
.auth-side h1 { font-size: clamp(34px, 4vw, 58px); line-height: 1.15; margin: 18px 0 14px; }
.auth-side p { margin: 0; color: var(--text-soft); line-height: 2; max-width: 540px; }
.auth-points {
  display: grid;
  gap: 12px;
  margin-top: 28px;
}
.auth-points article {
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
}
.auth-points strong { display: block; margin-bottom: 5px; }
.auth-points span { color: var(--text-mute); font-size: 13px; }
.auth-form-wrap {
  padding: 34px;
  display: grid;
  align-content: center;
}
.auth-form {
  width: 100%;
}
.auth-form h2 { margin: 16px 0 8px; font-size: 30px; }
.auth-form .lead { margin: 0 0 22px; color: var(--text-soft); line-height: 1.9; }
.field { display: grid; gap: 8px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: var(--text-soft); }
.field input, .field select, .field textarea {
  min-height: 50px;
  padding: 0 14px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: var(--bg-elevated);
  color: var(--text);
  outline: 0;
  transition: border-color var(--ease), background var(--ease);
}
.field textarea { min-height: 120px; padding: 14px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary);
}
.inline-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.note-link { text-decoration: none; color: var(--primary); font-weight: 700; font-size: 13px; }
.form-msg { min-height: 20px; margin-top: 12px; color: var(--danger); font-size: 13px; }

.dashboard-shell {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--sidebar);
  border-left: 1px solid var(--line);
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar .brand { margin-bottom: 28px; }
.side-label {
  color: var(--text-mute);
  font-size: 11px;
  letter-spacing: .12em;
  margin: 16px 12px 10px;
}
.side-nav {
  display: grid;
  gap: 6px;
}
.side-nav a {
  min-height: 46px;
  padding: 0 14px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-soft);
}
.side-nav a.active {
  background: var(--sidebar-active);
  color: var(--text);
  font-weight: 700;
}
.side-icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--bg-soft);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}
.sidebar-foot {
  position: absolute;
  right: 16px;
  left: 16px;
  bottom: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  border-radius: 16px;
  font-size: 12px;
  color: var(--text-soft);
}
.main-content {
  padding: 22px 28px 42px;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 16px;
  margin-bottom: 22px;
}
.page-head p { margin: 8px 0 0; color: var(--text-soft); }
.mobile-toggle { display: none; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.stat-card {
  padding: 20px;
  border-radius: 22px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.stat-card strong { display: block; font-size: 32px; margin-top: 14px; }
.stat-card small { color: var(--text-mute); }

.content-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 14px;
  margin-top: 14px;
}
.card-panel {
  padding: 20px;
  border-radius: 24px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.card-panel h2 { margin: 0; font-size: 20px; }
.card-panel p { color: var(--text-soft); line-height: 1.9; }
.info-list { display: grid; gap: 12px; }
.info-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 14px;
  border-radius: 16px;
  background: var(--surface-muted);
  border: 1px solid var(--line);
}
.info-item b { display: block; margin-bottom: 3px; font-size: 14px; }
.info-item span { color: var(--text-mute); font-size: 12px; }

.table-panel { margin-top: 14px; }
.table-wrap {
  overflow: auto;
  border-radius: 18px;
  border: 1px solid var(--line);
}
.table {
  width: 100%;
  border-collapse: collapse;
  min-width: 640px;
}
.table th, .table td {
  padding: 14px 16px;
  text-align: right;
  border-bottom: 1px solid var(--line);
}
.table th {
  background: var(--surface-muted);
  font-size: 12px;
  color: var(--text-mute);
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--bg-soft); }

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.status::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.status.active { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
.status.trial { color: var(--primary); background: var(--primary-soft); }
.status.frozen, .status.suspended { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.status.grace { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }

.modal[hidden] { display: none !important; }
.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(15, 23, 42, 0.35);
  backdrop-filter: blur(4px);
  padding: 20px;
  z-index: 40;
}
.modal-card {
  width: min(760px, 100%);
  max-height: 92vh;
  overflow: auto;
  padding: 24px;
  border-radius: 28px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-heavy);
}
.modal-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.modal-head p { margin: 6px 0 0; color: var(--text-soft); }
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 14px;
}
.form-grid .span-2 { grid-column: 1 / -1; }
.muted { color: var(--text-mute); }
.empty {
  text-align: center;
  padding: 26px;
  color: var(--text-mute);
}
.note-box {
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--text-soft);
  line-height: 1.8;
  font-size: 13px;
}

.footer-note {

  <script>
/* ===== INLINED FROM /js/ui.js ===== */
(function(){
  const THEME_KEY = 'af_theme';
  const DARK = 'dark';
  const LIGHT = 'light';

  function systemTheme(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT;
  }

  function normalizeTheme(value){
    return value === DARK ? DARK : LIGHT;
  }

  function currentTheme(){
    return normalizeTheme(document.documentElement.getAttribute('data-theme') || localStorage.getItem(THEME_KEY) || systemTheme());
  }

  function updateThemeColor(theme){
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', theme === DARK ? '#08111d' : '#f5f7fb');
  }

  function refreshThemeControls(){
    const theme = currentTheme();
    const dark = theme === DARK;

    document.querySelectorAll('[data-theme-label]').forEach(el => {
      el.textContent = dark ? 'الوضع الفاتح' : 'الوضع الداكن';
    });

    document.querySelectorAll('[data-theme-toggle], .theme-toggle').forEach(el => {
      el.setAttribute('aria-pressed', dark ? 'true' : 'false');
      el.setAttribute('aria-label', dark ? 'التحويل إلى الوضع الفاتح' : 'التحويل إلى الوضع الداكن');
      el.title = dark ? 'التحويل إلى الوضع الفاتح' : 'التحويل إلى الوضع الداكن';

      if (el.matches('[data-theme-icon]')) {
        el.textContent = dark ? '☀' : '◐';
      }
    });
  }

  function applyTheme(theme, persist = true){
    const next = normalizeTheme(theme);
    document.documentElement.setAttribute('data-theme', next);

    if(persist) localStorage.setItem(THEME_KEY, next);

    updateThemeColor(next);
    refreshThemeControls();

    window.dispatchEvent(new CustomEvent('academyflow:themechange', {
      detail: { theme: next }
    }));

    return next;
  }

  function toggleTheme(){
    return applyTheme(currentTheme() === DARK ? LIGHT : DARK, true);
  }

  window.toggleTheme = toggleTheme;
  window.setAcademyFlowTheme = applyTheme;
  window.getAcademyFlowTheme = currentTheme;

  applyTheme(localStorage.getItem(THEME_KEY) || systemTheme(), false);

  function toggleSidebar(){
    const sidebar = document.getElementById('sidebar');
    if(!sidebar) return;
    sidebar.classList.toggle('open');
    document.body.classList.toggle('sidebar-open', sidebar.classList.contains('open'));
  }

  function closeSidebar(){
    const sidebar = document.getElementById('sidebar');
    if(!sidebar) return;
    sidebar.classList.remove('open');
    document.body.classList.remove('sidebar-open');
  }

  window.toggleSidebar = toggleSidebar;
  window.closeSidebar = closeSidebar;

  document.addEventListener('DOMContentLoaded', () => {
    refreshThemeControls();

    document.addEventListener('click', event => {
      const themeButton = event.target.closest('[data-theme-toggle], .theme-toggle');
      if(themeButton){
        event.preventDefault();
        toggleTheme();
        return;
      }

      const reloadButton = event.target.closest('[data-reload]');
      if(reloadButton){
        event.preventDefault();
        location.reload();
        return;
      }

      const backButton = event.target.closest('[data-back]');
      if(backButton){
        event.preventDefault();
        history.length > 1 ? history.back() : location.assign('/');
        return;
      }

      const sidebar = document.getElementById('sidebar');
      if(sidebar && sidebar.classList.contains('open') && window.innerWidth <= 860){
        const toggle = event.target.closest('.mobile-toggle');
        if(!sidebar.contains(event.target) && !toggle) closeSidebar();
      }

      const hashLink = event.target.closest('a[href^="#"]');
      if(hashLink){
        const id = hashLink.getAttribute('href');
        if(id && id.length > 1){
          const target = document.querySelector(id);
          if(target){
            event.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', id);
          }
        }
      }
    });

    document.querySelectorAll('.side-nav a').forEach(link => {
      link.addEventListener('click', () => {
        if(window.innerWidth <= 860) closeSidebar();
      });
    });
  });

  window.addEventListener('resize', () => {
    if(window.innerWidth > 860) closeSidebar();
  });

  if(window.matchMedia){
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = event => {
      if(!localStorage.getItem(THEME_KEY)){
        applyTheme(event.matches ? DARK : LIGHT, false);
      }
    };

    if(media.addEventListener) media.addEventListener('change', onSystemChange);
    else if(media.addListener) media.addListener(onSystemChange);
  }
})();
</script>
  <script>
/* ===== INLINED FROM /js/student-quiz.js ===== */
window.StudentQuiz = (() => {
  let timerId=null;
  let autoSubmitting=false;
  let saveTimer=null;

  function esc(value){
    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  function fmtDate(value,withTime=false){
    if(!value)return '—';
    const d=new Date(value);
    if(Number.isNaN(d.getTime()))return '—';
    return withTime
      ? d.toLocaleString('ar-OM',{dateStyle:'medium',timeStyle:'short'})
      : d.toLocaleDateString('ar-OM',{dateStyle:'medium'});
  }

  function status(value){
    const map={
      in_progress:['جارية','warn'],
      pending_review:['بانتظار التصحيح','warn'],
      graded:['مصححة','good'],
      expired:['انتهى الوقت','bad'],
      published:['متاح','good'],
      closed:['مغلق','bad']
    };
    const item=map[value]||[value||'—','info'];
    return '<span class="student-status '+item[1]+'">'+esc(item[0])+'</span>';
  }

  async function api(url,options={}){
    const response=await fetch(url,{
      ...options,
      credentials:'same-origin',
      headers:{
        ...(options.body?{'Content-Type':'application/json'}:{}),
        ...(options.headers||{})
      }
    });

    if(response.status===401){
      localStorage.removeItem('af_user');
      location.replace('/academy/login.html');
      throw new Error('انتهت الجلسة');
    }

    const text=await response.text();
    let data=null;
    try{data=text?JSON.parse(text):null;}catch{data=text;}
    if(!response.ok)throw new Error(data?.message||'تعذر تنفيذ العملية');
    return data;
  }

  function toast(message,type='ok'){
    let box=document.getElementById('studentQuizToast');
    if(!box){
      box=document.createElement('div');
      box.id='studentQuizToast';
      box.className='student-quiz-toast';
      document.body.appendChild(box);
    }
    box.textContent=message;
    box.classList.toggle('error',type==='error');
    box.classList.add('show');
    clearTimeout(box._timer);
    box._timer=setTimeout(()=>box.classList.remove('show'),2400);
  }

  function attemptLabel(a){
    if(a.status==='graded')return a.passed?'ناجح':'غير مجتاز';
    if(a.status==='pending_review')return 'بانتظار التصحيح';
    if(a.status==='in_progress')return 'محاولة جارية';
    return a.status;
  }

  async function renderList(){
    clearInterval(timerId);
    const target=document.getElementById('studentPageContent');
    target.innerHTML='<div class="student-empty">جاري تحميل الاختبارات...</div>';

    try{
      const rows=await api('/api/student/quizzes');

      target.innerHTML=`
        <section class="student-card">
          <div class="student-card-head">
            <div><h2>اختبارات دوراتك</h2><p>ابدأ الاختبار عندما تكون جاهزًا. المؤقت يبدأ من لحظة بدء المحاولة.</p></div>
          </div>

          ${rows.length?'<div class="student-quiz-grid">'+rows.map((q,index)=>`
            <article class="student-quiz-card">
              <div class="student-quiz-card-head">
                <div>
                  <span class="student-quiz-course">${esc(q.course?.title||'دورة')}</span>
                  <h3>${esc(q.title)}</h3>
                </div>
                ${status(q.status)}
              </div>
              <p>${esc(q.description||'لا توجد تعليمات إضافية.')}</p>

              <div class="student-quiz-meta">
                <span>المدة <b>${esc(q.durationMinutes||0)} د</b></span>
                <span>المحاولات <b>${esc(q.attempts.length)} / ${esc(q.maxAttempts)}</b></span>
                <span>النجاح <b>${esc(q.passingPercentage)}%</b></span>
                <span>الدرجة <b>${esc(q.totalMarks)}</b></span>
              </div>

              <div class="student-quiz-date">
                <span>متاح: ${fmtDate(q.availableFrom,true)}</span>
                <span>ينتهي: ${fmtDate(q.dueAt,true)}</span>
              </div>

              <div class="student-quiz-actions">
                ${q.activeAttempt
                  ? '<a class="btn primary" href="/student/quiz.html?attempt='+encodeURIComponent(q.activeAttempt.id)+'">متابعة المحاولة</a>'
                  : q.canStart
                    ? '<button class="btn primary student-start-quiz" data-index="'+index+'" type="button">بدء الاختبار</button>'
                    : '<button class="btn ghost" type="button" disabled>غير متاح للبدء</button>'}
              </div>

              ${q.attempts.length?`
                <div class="student-quiz-history">
                  <b>المحاولات السابقة</b>
                  ${q.attempts.map(a=>`
                    <div>
                      <span>#${esc(a.attemptNumber)} · ${esc(attemptLabel(a))}</span>
                      <span>${a.status==='graded'||a.status==='pending_review'
                        ? esc(a.percentage)+'%'
                        : ''}
                        ${a.status!=='in_progress'
                          ? '<a href="/student/quiz.html?result='+encodeURIComponent(a.id)+'">النتيجة</a>'
                          : ''}
                      </span>
                    </div>
                  `).join('')}
                </div>
              `:''}
            </article>
          `).join('')+'</div>':'<div class="student-empty">لا توجد اختبارات منشورة في دوراتك حاليًا.</div>'}
        </section>
      `;

      document.querySelectorAll('.student-start-quiz').forEach(btn=>{
        btn.onclick=async()=>{
          const quiz=rows[Number(btn.dataset.index)];
          if(!confirm('سيبدأ المؤقت فور بدء المحاولة. هل تريد المتابعة؟'))return;
          btn.disabled=true;
          btn.textContent='جاري البدء...';
          try{
            const data=await api('/api/student/quizzes/'+quiz.id+'/start',{method:'POST'});
            location.href='/student/quiz.html?attempt='+encodeURIComponent(data.attempt.id);
          }catch(err){
            toast(err.message,'error');
            btn.disabled=false;
            btn.textContent='بدء الاختبار';
          }
        };
      });
    }catch(err){
      target.innerHTML='<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  function formatTime(seconds){
    seconds=Math.max(0,Number(seconds||0));
    const h=Math.floor(seconds/3600);
    const m=Math.floor((seconds%3600)/60);
    const s=seconds%60;
    return h>0
      ? [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')
      : [m,s].map(x=>String(x).padStart(2,'0')).join(':');
  }

  function answered(question){
    const a=question.answer;
    if(!a)return false;
    if(question.type==='multiple_choice')return Boolean(a.selectedOptionId);
    if(question.type==='true_false')return typeof a.booleanAnswer==='boolean';
    return Boolean(String(a.textAnswer||'').trim());
  }

  async function saveAnswer(attemptId,question,payload,silent=false){
    try{
      const data=await api('/api/student/quiz-attempts/'+attemptId+'/questions/'+question.id,{
        method:'PATCH',
        body:JSON.stringify(payload)
      });
      if(!silent)toast('تم حفظ الإجابة');
      return data;
    }catch(err){
      toast(err.message,'error');
      throw err;
    }
  }

  async function submitAttempt(attemptId,automatic=false){
    if(autoSubmitting)return;
    autoSubmitting=true;
    clearInterval(timerId);
    clearTimeout(saveTimer);

    try{
      const data=await api('/api/student/quiz-attempts/'+attemptId+'/submit',{method:'POST'});
      if(automatic)toast('انتهى الوقت وتم تسليم الاختبار تلقائيًا');
      location.replace('/student/quiz.html?result='+encodeURIComponent(data.attempt.id));
    }catch(err){
      autoSubmitting=false;
      toast(err.message,'error');
    }
  }

  function questionInput(question,attemptId,onChanged){
    const a=question.answer||{};

    if(question.type==='multiple_choice'){
      return `
        <div class="student-quiz-options">
          ${question.options.map(option=>`
            <label class="student-quiz-option">
              <input type="radio" name="quizAnswer" value="${esc(option.id)}" ${String(a.selectedOptionId||'')===String(option.id)?'checked':''}>
              <span><i></i>${esc(option.text)}</span>
            </label>
          `).join('')}
        </div>
      `;
    }

    if(question.type==='true_false'){
      return `
        <div class="student-quiz-options student-quiz-boolean">
          <label class="student-quiz-option">
            <input type="radio" name="quizBoolean" value="true" ${a.booleanAnswer===true?'checked':''}>
            <span><i></i>صح</span>
          </label>
          <label class="student-quiz-option">
            <input type="radio" name="quizBoolean" value="false" ${a.booleanAnswer===false?'checked':''}>
            <span><i></i>خطأ</span>
          </label>
        </div>
      `;
    }

    return `
      <div class="field student-quiz-text">
        <label>إجابتك</label>
        <textarea id="quizTextAnswer" maxlength="10000" placeholder="اكتب إجابتك هنا...">${esc(a.textAnswer||'')}</textarea>
        <small>يتم حفظ الإجابة تلقائيًا أثناء الكتابة.</small>
      </div>
    `;
  }

  async function renderAttempt(attemptId){
    const target=document.getElementById('studentPageContent');
    target.innerHTML='<div class="student-empty">جاري فتح المحاولة...</div>';

    try{
      const data=await api('/api/student/quiz-attempts/'+encodeURIComponent(attemptId));

      if(data.completed){
        location.replace('/student/quiz.html?result='+encodeURIComponent(data.attempt.id));
        return;
      }

      let index=0;
      const questions=data.questions;
      const attempt=data.attempt;
      let seconds=attempt.remainingSeconds;
      let submitted=false;

      const draw=()=>{
        const q=questions[index];
        const answeredCount=questions.filter(answered).length;

        target.innerHTML=`
          <section class="student-quiz-exam-head">
            <div>
              <a href="/student/quizzes.html" class="student-quiz-exit">← الاختبارات</a>
              <span class="student-quiz-course">${esc(data.quiz.course?.title||'')}</span>
              <h2>${esc(data.quiz.title)}</h2>
              <p>المحاولة #${esc(attempt.attemptNumber)} · ${answeredCount} من ${questions.length} مجاب</p>
            </div>
            <div class="student-quiz-timer ${seconds!==null&&seconds<=300?'danger':''}">
              <small>الوقت المتبقي</small>
              <b id="quizTimer">${seconds===null?'بدون مؤقت':formatTime(seconds)}</b>
            </div>
          </section>

          <section class="student-quiz-exam-layout">
            <article class="student-card student-quiz-question">
              <div class="student-quiz-question-head">
                <span>السؤال ${index+1} من ${questions.length}</span>
                <b>${esc(q.marks)} درجة</b>
              </div>
              <h3>${esc(q.prompt)}</h3>
              ${questionInput(q,attemptId)}

              <div class="student-quiz-nav">
                <button class="btn ghost" id="quizPrev" type="button" ${index===0?'disabled':''}>السابق</button>
                <div class="student-quiz-save-state" id="quizSaveState">محفوظ</div>
                ${index<questions.length-1
                  ? '<button class="btn primary" id="quizNext" type="button">التالي</button>'
                  : '<button class="btn primary" id="quizSubmit" type="button">تسليم الاختبار</button>'}
              </div>
            </article>

            <aside class="student-card student-quiz-map">
              <h3>الأسئلة</h3>
              <div class="student-quiz-map-grid">
                ${questions.map((item,i)=>`
                  <button class="${i===index?'active':''} ${answered(item)?'answered':''}" data-index="${i}" type="button">${i+1}</button>
                `).join('')}
              </div>
              <div class="student-quiz-map-legend"><span><i class="answered"></i>مجاب</span><span><i></i>غير مجاب</span></div>
            </aside>
          </section>
        `;

        const setSaving=txt=>{
          const el=document.getElementById('quizSaveState');
          if(el)el.textContent=txt;
        };

        document.querySelectorAll('input[name="quizAnswer"]').forEach(input=>{
          input.onchange=async()=>{
            q.answer={...(q.answer||{}),selectedOptionId:input.value,booleanAnswer:null,textAnswer:''};
            setSaving('جاري الحفظ...');
            try{
              await saveAnswer(attemptId,q,{selectedOptionId:input.value},true);
              setSaving('تم الحفظ');
              setTimeout(draw,180);
            }catch{setSaving('تعذر الحفظ');}
          };
        });

        document.querySelectorAll('input[name="quizBoolean"]').forEach(input=>{
          input.onchange=async()=>{
            const value=input.value==='true';
            q.answer={...(q.answer||{}),booleanAnswer:value,selectedOptionId:'',textAnswer:''};
            setSaving('جاري الحفظ...');
            try{
              await saveAnswer(attemptId,q,{booleanAnswer:value},true);
              setSaving('تم الحفظ');
              setTimeout(draw,180);
            }catch{setSaving('تعذر الحفظ');}
          };
        });

        const text=document.getElementById('quizTextAnswer');
        if(text){
          text.oninput=()=>{
            q.answer={...(q.answer||{}),textAnswer:text.value,selectedOptionId:'',booleanAnswer:null};
            setSaving('جاري الحفظ...');
            clearTimeout(saveTimer);
            saveTimer=setTimeout(async()=>{
              try{
                await saveAnswer(attemptId,q,{textAnswer:text.value},true);
                setSaving('تم الحفظ');
              }catch{setSaving('تعذر الحفظ');}
            },650);
          };
        }

        document.getElementById('quizPrev').onclick=()=>{
          clearTimeout(saveTimer);
          index=Math.max(0,index-1);
          draw();
        };

        const next=document.getElementById('quizNext');
        if(next)next.onclick=()=>{
          clearTimeout(saveTimer);
          index=Math.min(questions.length-1,index+1);
          draw();
        };

        const submit=document.getElementById('quizSubmit');
        if(submit)submit.onclick=()=>{
          if(confirm('هل أنت متأكد من تسليم الاختبار؟ لن تتمكن من تعديل الإجابات بعد التسليم.')){
            submitted=true;
            submitAttempt(attemptId,false);
          }
        };

        document.querySelectorAll('.student-quiz-map button').forEach(btn=>{
          btn.onclick=()=>{
            clearTimeout(saveTimer);
            index=Number(btn.dataset.index);
            draw();
          };
        });
      };

      draw();

      clearInterval(timerId);
      if(seconds!==null){
        timerId=setInterval(()=>{
          seconds=Math.max(0,seconds-1);
          const timer=document.getElementById('quizTimer');
          if(timer)timer.textContent=formatTime(seconds);

          const box=timer?.closest('.student-quiz-timer');
          if(box)box.classList.toggle('danger',seconds<=300);

          if(seconds<=0 && !submitted){
            submitted=true;
            clearInterval(timerId);
            submitAttempt(attemptId,true);
          }
        },1000);
      }

    }catch(err){
      target.innerHTML='<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  function resultAnswerText(question){
    const a=question.answer;
    if(!a)return 'لم تتم الإجابة';

    if(question.type==='multiple_choice'){
      return question.options.find(o=>String(o.id)===String(a.selectedOptionId))?.text || 'لم تتم الإجابة';
    }
    if(question.type==='true_false'){
      return typeof a.booleanAnswer==='boolean'?(a.booleanAnswer?'صح':'خطأ'):'لم تتم الإجابة';
    }
    return a.textAnswer||'لم تتم الإجابة';
  }

  function correctText(question){
    if(!question.correctAnswer)return '';
    if(question.type==='multiple_choice')return question.correctAnswer.correctOptionText||'';
    if(question.type==='true_false')return question.correctAnswer.correctBoolean?'صح':'خطأ';
    return '';
  }

  async function renderResult(attemptId){
    clearInterval(timerId);
    const target=document.getElementById('studentPageContent');
    target.innerHTML='<div class="student-empty">جاري تحميل النتيجة...</div>';

    try{
      const data=await api('/api/student/quiz-attempts/'+encodeURIComponent(attemptId)+'/result');
      const a=data.attempt;
      const pending=a.requiresManualReview||a.status==='pending_review';

      target.innerHTML=`
        <section class="student-quiz-result-hero ${pending?'pending':a.passed?'passed':'failed'}">
          <div>
            <a href="/student/quizzes.html" class="student-quiz-exit">← العودة للاختبارات</a>
            <span class="student-quiz-course">${esc(data.quiz.course?.title||'')}</span>
            <h2>${esc(data.quiz.title)}</h2>
            <p>${pending?'توجد إجابات قصيرة تحتاج إلى تصحيح المدرب. النتيجة النهائية قد تتغير.':a.passed?'تم اجتياز الاختبار بنجاح.':'لم تصل إلى نسبة النجاح المطلوبة.'}</p>
          </div>
          <div class="student-quiz-result-score">
            <strong>${esc(a.percentage)}%</strong>
            <span>${esc(a.score)} / ${esc(a.totalMarks)}</span>
          </div>
        </section>

        <section class="student-card student-section">
          <div class="student-card-head">
            <div><h2>مراجعة الإجابات</h2><p>${data.quiz.showCorrectAnswers?'الأكاديمية تسمح بعرض الإجابات الصحيحة.':'الإجابات الصحيحة مخفية حسب إعداد الاختبار.'}</p></div>
            ${status(a.status)}
          </div>

          <div class="student-quiz-result-list">
            ${data.questions.map((q,i)=>`
              <article class="student-quiz-result-question">
                <div class="student-quiz-result-head">
                  <div><small>السؤال ${i+1}</small><h3>${esc(q.prompt)}</h3></div>
                  <span>${esc(q.answer?.awardedMarks ?? '—')} / ${esc(q.marks)}</span>
                </div>
                <p><b>إجابتك:</b> ${esc(resultAnswerText(q))}</p>
                ${q.answer?.needsManualReview?'<div class="academy-note">بانتظار تصحيح المدرب.</div>':''}
                ${q.answer?.feedback?'<div class="academy-note">تعليق المدرب: '+esc(q.answer.feedback)+'</div>':''}
                ${data.quiz.showCorrectAnswers && q.correctAnswer
                  ? '<div class="student-quiz-correct"><b>الإجابة الصحيحة:</b> '+esc(correctText(q))+(q.explanation?'<p>'+esc(q.explanation)+'</p>':'')+'</div>'
                  : ''}
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }catch(err){
      target.innerHTML='<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  async function renderQuizPage(){
    const params=new URLSearchParams(location.search);
    const result=params.get('result');
    const attempt=params.get('attempt');

    if(result)return renderResult(result);
    if(attempt)return renderAttempt(attempt);

    document.getElementById('studentPageContent').innerHTML='<div class="student-card student-empty">لم يتم تحديد محاولة.</div>';
  }

  return { renderList, renderQuizPage };
})();
</script>

<body class="student-app" data-page="quiz">
  <div id="studentApp"></div>
  <script>
/* ===== INLINED FROM /js/student-app.js ===== */
const StudentPortal = (() => {
  let user = null;

  try {
    user = JSON.parse(localStorage.getItem('af_user') || 'null');
  } catch {}

  if (!user || user.role !== 'student') {
    location.href = '/academy/login.html';
    return {};
  }

  const page = document.body.dataset.page || 'dashboard';
  let profileCache = null;
  let modalSubmit = null;

  const meta = {
    dashboard: ['مرحبًا '+(user.name || 'بالطالب'),'تابع دراستك، تقدمك، ومحاضراتك من مكان واحد.'],

    course: ['الدورة','شاهد الدروس وأكملها بالتسلسل داخل AcademyFlow.'],
    live: ['المحاضرات المباشرة','جلسات Zoom المرتبطة بالدورات المسجل فيها حسابك.'],
    assignments: ['الواجبات','تابع المطلوب منك وسلّم إجابتك من نفس الصفحة.'],
    quizzes: ['الاختبارات','ابدأ الاختبارات وتابع محاولاتك ونتائجك.'],
    quiz: ['حل الاختبار','أجب عن الأسئلة وسيتم حفظ إجاباتك تلقائيًا.'],
    payments: ['المدفوعات','سجل الدفعات وحالتها والمبالغ المسجلة على حسابك.'],
    certificates: ['الشهادات','شهاداتك الصادرة من الأكاديمية.'],
    notifications: ['الإشعارات','آخر التنبيهات والإعلانات الموجهة للطلاب.'],
    profile: ['حسابي','بيانات حسابك وتغيير كلمة المرور.']
  };

  const nav = [
    ['dashboard','الرئيسية','⌂'],
    ['courses','دوراتي','C'],
    ['live','المحاضرات','Z'],
    ['assignments','الواجبات','A'],
    ['quizzes','الاختبارات','Q'],
    ['payments','المدفوعات','P'],
    ['certificates','الشهادات','✓'],
    ['notifications','الإشعارات','N'],
    ['profile','حسابي','U']
  ];

  function esc(value) {
    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  function fmtDate(value, withTime = false) {
    if (!value) return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '—';

    return withTime
      ? date.toLocaleString('ar-OM',{dateStyle:'medium',timeStyle:'short'})
      : date.toLocaleDateString('ar-OM',{dateStyle:'medium'});
  }

  function fmtMoney(value, currency='OMR') {
    return new Intl.NumberFormat('en-OM',{
      style:'currency',
      currency,
      maximumFractionDigits:3
    }).format(Number(value || 0));
  }

  function status(value) {
    const map = {
      active:['نشط','good'],
      completed:['مكتمل','good'],
      paid:['مدفوع','good'],
      issued:['صادرة','good'],
      live:['مباشر','good'],
      submitted:['تم التسليم','good'],
      graded:['تم التصحيح','good'],
      scheduled:['مجدول','warn'],
      paused:['متوقف مؤقتًا','warn'],
      pending:['معلق','warn'],
      published:['منشور','good'],
      closed:['مغلق','bad'],
      ended:['انتهت','info'],
      cancelled:['ملغي','bad'],
      refunded:['مسترجع','bad'],
      failed:['فشل','bad']
    };
    const item = map[value] || [value || '—','info'];
    return '<span class="student-status '+item[1]+'">'+esc(item[0])+'</span>';
  }

  async function api(url, options={}) {
    const response = await fetch(url,{
      ...options,
      credentials:'same-origin',
      headers:{
        ...(options.body ? {'Content-Type':'application/json'} : {}),
        ...(options.headers || {})
      }
    });

    if (response.status === 401 || response.status === 403) {
      if (response.status === 401) {
        localStorage.removeItem('af_token');
        localStorage.removeItem('af_user');
        location.href = '/academy/login.html';
      }
    }

    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }

    if (!response.ok) {
      throw new Error(data?.message || 'تعذر تنفيذ العملية');
    }

    return data;
  }

  function route(name) {
    return '/student/'+name+'.html';
  }

  function renderShell() {
    const root = document.getElementById('studentApp');
    const current = meta[page] || ['بوابة الطالب',''];

    root.innerHTML = `
      <div class="student-layout">
        <aside class="student-sidebar" id="studentSidebar">
          <a class="brand" href="/student/dashboard.html">
            <span class="brand-badge">AF</span>
            <span class="brand-text"><b>AcademyFlow</b><small>STUDENT PORTAL</small></span>
          </a>

          <div class="student-nav-title">التعلم</div>
          <nav class="student-nav">
            ${nav.slice(0,5).map(x => navItem(x)).join('')}
          </nav>

          <div class="student-nav-title">حسابي</div>
          <nav class="student-nav">
            ${nav.slice(5).map(x => navItem(x)).join('')}
          </nav>

          <div class="student-sidebar-card">
            <small>الأكاديمية</small>
            <b>${esc(user.academyName || user.academyCode || 'AcademyFlow')}</b>
          </div>
        </aside>

        <div class="student-overlay" id="studentOverlay"></div>

        <main class="student-main">
          <div class="student-content">
            <header class="student-topbar">
              <div style="display:flex;gap:9px;align-items:flex-start;min-width:0">
                <button class="student-menu-btn" id="studentMenuButton" type="button" aria-label="فتح القائمة">☰</button>
                <div class="student-heading">
                  <span class="student-eyebrow">STUDENT PORTAL</span>
                  <h1>${esc(current[0])}</h1>
                  <p>${esc(current[1])}</p>
                </div>
              </div>

              <div class="student-top-actions">
                <button class="theme-toggle" data-theme-toggle data-theme-icon type="button" title="فاتح / داكن">◐</button>
                <div class="student-user">
                  <span class="student-avatar">${esc((user.name || 'ST').slice(0,2).toUpperCase())}</span>
                  <span><b>${esc(user.name || 'الطالب')}</b><span>${esc(user.email || '')}</span></span>
                </div>
                <button class="btn ghost" id="studentLogout" type="button">خروج ↗</button>
              </div>
            </header>

            <section id="studentUrgentBanner" class="student-urgent-slot" hidden></section>
            <section id="studentPageContent"></section>
            <div class="student-footer">AcademyFlow · Student Portal</div>
          </div>

  function urgentCountdownText(seconds) {
    const value = Number(seconds || 0);

    if (value <= 0) return 'المحاضرة بدأت الآن';

    const minutes = Math.floor(value / 60);
    const secondsPart = Math.max(0,value % 60);

    if (minutes >= 60) {
      const hours = Math.floor(minutes / 60);
      const left = minutes % 60;
      return 'تبدأ بعد '+hours+' س '+left+' د';
    }

    return 'تبدأ بعد '+String(minutes).padStart(2,'0')+':'+String(secondsPart).padStart(2,'0');
  }

  let youtubeApiPromise = null;

  function ensureYouTubeApi() {
    if (window.YT?.Player) return Promise.resolve(window.YT);
    if (youtubeApiPromise) return youtubeApiPromise;

    youtubeApiPromise = new Promise((resolve,reject) => {
      const previousReady = window.onYouTubeIframeAPIReady;
      let settled = false;

      const finish = () => {
        if (settled || !window.YT?.Player) return;
        settled = true;
        resolve(window.YT);
      };

      window.onYouTubeIframeAPIReady = () => {
        try {
          if (typeof previousReady === 'function') previousReady();
        } catch {}
        finish();
      };

      if (!document.querySelector('script[data-academyflow-youtube-api]')) {
        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        script.async = true;
        script.dataset.academyflowYoutubeApi = '1';
        script.onerror = () => {
          if (!settled) {
            settled = true;
            youtubeApiPromise = null;
            reject(new Error('تعذر تحميل مشغل YouTube'));
          }
        };
        document.head.appendChild(script);
      }

      const check = setInterval(() => {
        if (window.YT?.Player) {
          clearInterval(check);
          finish();
        }
      },250);

      setTimeout(() => {
        clearInterval(check);
        if (!settled) {
          settled = true;
          youtubeApiPromise = null;
          reject(new Error('استغرق تحميل مشغل YouTube وقتًا طويلًا'));
        }
      },12000);
    });

    return youtubeApiPromise;
  }

  function createLessonVideoTracker({ lesson, onProgress, onCompleted, onError }) {
    let player = null;
    let heartbeat = null;
    let destroyed = false;
    let sending = false;
    let queued = false;
    let completedAnnounced = Boolean(lesson.completed);

    const endpoint = '/api/student/lessons/'+encodeURIComponent(lesson.id)+'/progress';

    const clearHeartbeat = () => {
      if (heartbeat) clearInterval(heartbeat);
      heartbeat = null;
    };

    const playerSnapshot = () => {
      if (!player || destroyed) return null;

      try {
        return {
          positionSeconds:Number(player.getCurrentTime() || 0),
          durationSeconds:Number(player.getDuration() || 0),
          playerState:Number(player.getPlayerState()),
          playbackRate:Number(player.getPlaybackRate?.() || 1)
        };
      } catch {
        return null;
      }
    };

    const submitSnapshot = async (snapshot, ended=false, keepalive=false) => {
      if (!snapshot) return;

      const payload = {
        ...snapshot,
        ended:Boolean(ended)
      };

      if (keepalive) {
        try {
          fetch(endpoint,{
            method:'POST',
            credentials:'same-origin',
            keepalive:true,
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(payload)
          });
        } catch {}
        return;
      }

      if (sending) {
        queued = { snapshot, ended };
        return;
      }

      sending = true;

      try {
        const result = await api(endpoint,{
          method:'POST',
          body:JSON.stringify(payload)
        });

        if (result?.lesson) {
          Object.assign(lesson,{
            completed:Boolean(result.lesson.completed),
            completedAt:result.lesson.completedAt || null,
            watchedSeconds:Number(result.lesson.watchedSeconds || 0),
            watchedPercent:Number(result.lesson.watchedPercent || 0),
            durationSeconds:Number(result.lesson.durationSeconds || 0),
            resumePositionSeconds:Number(result.lesson.resumePositionSeconds || 0)
          });

          onProgress?.(result.lesson,result.courseProgress);

          if (lesson.completed && !completedAnnounced) {
            completedAnnounced = true;
            onCompleted?.(result.lesson,result.courseProgress);
          }
        }
      } catch (err) {
        onError?.(err);
      } finally {
        sending = false;

        if (queued) {
          const next = queued;
          queued = false;
          submitSnapshot(next.snapshot,next.ended,false);
        }
      }
    };

    const flush = (ended=false, keepalive=false) => {
      const snapshot = playerSnapshot();
      if (!snapshot) return;
      submitSnapshot(snapshot,ended,keepalive);
    };

    const startHeartbeat = () => {
      clearHeartbeat();
      heartbeat = setInterval(() => flush(false,false),10000);
    };

    ensureYouTubeApi()
      .then(YT => {
        if (destroyed) return;

        player = new YT.Player('lessonYoutubePlayer',{
          host:'https://www.youtube-nocookie.com',
          width:'100%',
          height:'100%',
          videoId:lesson.youtubeId,
          playerVars:{
            rel:0,
            playsinline:1,
            modestbranding:1
          },
          events:{
            onReady:event => {
              if (destroyed) return;

              const duration = Number(event.target.getDuration() || 0);
              const resume = Number(lesson.resumePositionSeconds || 0);

              if (
                !lesson.completed &&
                resume > 3 &&
                (!duration || resume < duration - 5)
              ) {
                event.target.seekTo(resume,true);
              }

              setTimeout(() => flush(false,false),700);
            },
            onStateChange:event => {
              if (destroyed) return;

              if (event.data === YT.PlayerState.PLAYING) {
                startHeartbeat();
                setTimeout(() => flush(false,false),600);
                return;
              }

              clearHeartbeat();

              if (event.data === YT.PlayerState.ENDED) {
                flush(true,false);
              } else if (
                event.data === YT.PlayerState.PAUSED ||
                event.data === YT.PlayerState.CUED
              ) {
                flush(false,false);
              }
            },
            onError:() => {
              onError?.(new Error('تعذر تشغيل فيديو YouTube'));
            }
          }
        });
      })
      .catch(err => onError?.(err));

    return {
      flushKeepalive(){
        flush(false,true);
      },
      destroy(){
        if (destroyed) return;
        flush(false,true);
        destroyed = true;
        clearHeartbeat();

        try {
          player?.destroy();
        } catch {}
      }
    };
  }

                  return `
                    <button
                      class="student-lesson ${String(x.id) === String(activeId) ? 'active' : ''} ${x.completed ? 'done' : ''}"
                      data-lesson-id="${esc(x.id)}"
                      type="button">
                      <span class="student-lesson-number">${x.completed ? '✓' : esc(x.order)}</span>
                      <span>
                        <b>${esc(x.title)}</b>
                        <span class="student-lesson-watch">
                          ${x.completed
                            ? 'مكتمل'
                            : percent > 0
                              ? percent+'% مشاهدة · غير مكتمل'
                              : 'لم يبدأ'}
                        </span>
                      </span>
                    </button>
                  `;
                }).join('')}
              </aside>
            </section>
          ` : '<div class="student-card student-empty">لم تنشر الأكاديمية دروسًا في هذه الدورة حتى الآن.</div>'}
        `;

        document.querySelectorAll('.student-lesson').forEach(btn => {
          btn.onclick = () => {
            activeId = btn.dataset.lessonId;
            draw();
          };
        });

        const manualComplete = document.getElementById('manualLessonComplete');

        if (manualComplete && active && !active.youtubeId) {
          manualComplete.onclick = async () => {
            manualComplete.disabled = true;

            try {
              const result = await api(
                '/api/student/lessons/'+encodeURIComponent(active.id)+'/progress',
                {
                  method:'POST',
                  body:JSON.stringify({manualComplete:true})
                }
              );

              Object.assign(active,result.lesson);
              updateProgressUi(active,result.courseProgress);
              draw();
            } catch (err) {
              alert(err.message);
              manualComplete.disabled = false;
            }
          };
        }

        if (active?.youtubeId) {
          videoTracker = createLessonVideoTracker({
            lesson:active,
            onProgress:(saved,courseProgress) => {
              Object.assign(active,saved);
              updateProgressUi(active,courseProgress);
            },
            onCompleted:(saved,courseProgress) => {
              Object.assign(active,saved);
              updateProgressUi(active,courseProgress);
            },
            onError:err => {
              const note = document.querySelector('.student-watch-note');
              if (note) note.textContent = err.message;
            }
          });
        }
      };

      window.addEventListener('pagehide',() => {
        videoTracker?.flushKeepalive();
      },{once:true});

      draw();
    } catch (err) {
      videoTracker?.destroy();
      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  async function renderLive() {

    target.innerHTML = '<div class="student-empty">جاري تحميل المحاضرات...</div>';

    try {
      const rows = await api('/api/student/live');
      const now = Date.now();

      target.innerHTML = `
        <section class="student-card">
          <div class="student-card-head"><div><h2>جلسات Zoom</h2><p>لا يظهر لك إلا الجلسات المرتبطة بدوراتك.</p></div></div>
          <div class="student-list">
            ${rows.length ? rows.map(x => {
              const joinable = x.joinAvailable && !['ended','cancelled'].includes(x.status);
              return `
                <div class="student-list-row">
                  <div><b>${esc(x.title)}</b><span>${esc(x.course?.title || '')} · ${esc(x.startAtDisplay || fmtDate(x.startAt,true))} · ${esc(x.instructor?.name || '')}</span></div>
                  <div class="student-actions">
                    ${status(x.status)}

    } catch (err) {
      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }

  async function renderAssignments() {
    const target = document.getElementById('studentPageContent');
    target.innerHTML = '<div class="student-empty">جاري تحميل الواجبات...</div>';

    const load = async () => {
      try {
        const rows = await api('/api/student/assessments?type=assignment');

        target.innerHTML = rows.length ? '<div class="student-assessment-grid">'+rows.map((x,i) => `
          <article class="student-assessment">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
              <div><h3>${esc(x.title)}</h3><p>${esc(x.course?.title || '')}</p></div>
              ${x.submission ? status(x.submission.status) : status(x.status)}
            </div>
            <p>${esc(x.description || 'لا توجد تعليمات إضافية.')}</p>
            <div class="student-meta">
              <span>الدرجة: ${esc(x.totalMarks)}</span>
              <span>التسليم: ${fmtDate(x.dueAt,true)}</span>
              ${x.submission?.score !== null && x.submission?.score !== undefined ? '<span>درجتك: '+esc(x.submission.score)+'</span>' : ''}
            </div>
            ${x.submission?.feedback ? '<div class="student-card" style="box-shadow:none;margin-top:10px;padding:10px"><small>تعليق المدرب</small><p style="margin:4px 0 0">'+esc(x.submission.feedback)+'</p></div>' : ''}
            <button class="btn ${x.submission ? 'soft' : 'primary'} student-submit-assignment" data-index="${i}" type="button" style="margin-top:11px;width:100%">
              ${x.submission ? 'تعديل التسليم' : 'تسليم الواجب'}
            </button>
          </article>
        `).join('')+'</div>' : '<div class="student-card student-empty">لا توجد واجبات منشورة حاليًا.</div>';

        document.querySelectorAll('.student-submit-assignment').forEach(btn => {
          btn.onclick = () => openAssignment(rows[Number(btn.dataset.index)],load);
        });
      } catch (err) {
        target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
      }
    };

    await load();
  }

  function openAssignment(row,onDone) {
    openModal({
      title:'تسليم الواجب',
      subtitle:row.title+' · '+(row.course?.title || ''),
      html:`
        <div class="field">
          <label>إجابتك</label>
          <textarea name="answerText" rows="7" placeholder="اكتب إجابتك هنا...">${esc(row.submission?.answerText || '')}</textarea>
        </div>
        <div class="field">
          <label>رابط ملف مرفق (اختياري)</label>
          <input name="attachmentUrl" type="url" placeholder="https://..." value="${esc(row.submission?.attachmentUrl || '')}">
        </div>
        <div class="student-form-message"></div>
        <div class="student-actions" style="justify-content:flex-end">
          <button class="btn primary" type="submit">إرسال الواجب</button>
        </div>
      `,
      onSubmit:async data => {
        await api('/api/student/assignments/'+encodeURIComponent(row.id)+'/submission',{
          method:'POST',
          body:JSON.stringify(data)
        });
        closeModal();
        await onDone();
      }
    });
  }

  async function renderQuizzes() {
    const target = document.getElementById('studentPageContent');
    target.innerHTML = '<div class="student-empty">جاري تحميل الاختبارات...</div>';

    try {
      const rows = await api('/api/student/assessments?type=quiz');

      target.innerHTML = rows.length ? '<div class="student-assessment-grid">'+rows.map(x => `
        <article class="student-assessment">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
            <div><h3>${esc(x.title)}</h3><p>${esc(x.course?.title || '')}</p></div>
            ${status(x.status)}
          </div>
          <p>${esc(x.description || 'لا توجد تعليمات إضافية.')}</p>
          <div class="student-meta">
            <span>الدرجة: ${esc(x.totalMarks)}</span>
            <span>النجاح: ${esc(x.passingMark)}</span>
            <span>المدة: ${esc(x.durationMinutes || 0)} دقيقة</span>
            <span>الموعد: ${fmtDate(x.dueAt,true)}</span>
          </div>
          <div class="student-card" style="box-shadow:none;margin-top:11px;padding:10px">
            <small style="color:var(--text-mute)">واجهة حل الأسئلة التفصيلية ستُفعل عندما تضيف الأكاديمية أسئلة للاختبار.</small>
          </div>
        </article>
      `).join('')+'</div>' : '<div class="student-card student-empty">لا توجد اختبارات منشورة حاليًا.</div>';
    } catch (err) {
      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  async function renderPayments() {
    const target = document.getElementById('studentPageContent');
    target.innerHTML = '<div class="student-empty">جاري تحميل المدفوعات...</div>';

    try {
      const data = await api('/api/student/payments');

      target.innerHTML = `
        <section class="student-kpis">
          ${kpi('المدفوع',fmtMoney(data.summary.paid))}
          ${kpi('المعلق',fmtMoney(data.summary.pending))}
          ${kpi('المسترجع',fmtMoney(data.summary.refunded))}
          ${kpi('عدد العمليات',data.rows.length)}
        </section>

        <section class="student-card">
          <div class="student-card-head"><div><h2>سجل المدفوعات</h2><p>الدفعات المرتبطة بحسابك فقط.</p></div></div>
          <div class="student-table-wrap">
            <table class="student-table">
              <thead><tr><th>الدورة</th><th>المبلغ</th><th>الطريقة</th><th>الحالة</th><th>المرجع</th><th>التاريخ</th></tr></thead>
              <tbody>
                ${data.rows.length ? data.rows.map(x => `
                  <tr>
                    <td>${esc(x.courseId?.title || 'عام')}</td>
                    <td><b>${fmtMoney(x.amount,x.currency || 'OMR')}</b></td>
                    <td>${esc(x.method)}</td>
                    <td>${status(x.status)}</td>
                    <td>${esc(x.reference || '—')}</td>
                    <td>${fmtDate(x.paidAt)}</td>
                  </tr>
                `).join('') : '<tr><td colspan="6" class="student-empty">لا توجد مدفوعات مسجلة.</td></tr>'}
              </tbody>
            </table>
          </div>
        </section>
      `;
    } catch (err) {
      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  async function renderCertificates() {
    const target = document.getElementById('studentPageContent');
    target.innerHTML = '<div class="student-empty">جاري تحميل الشهادات...</div>';

    try {
      const rows = await api('/api/student/certificates');

      target.innerHTML = `
        <section class="student-card">
          <div class="student-card-head">
            <div><h2>شهاداتي</h2><p>الشهادات الصادرة والمعتمدة في حسابك.</p></div>
            ${rows.length ? '<button class="btn secondary" id="printCertificates" type="button">طباعة</button>' : ''}
          </div>
          ${rows.length ? '<div class="student-course-grid">'+rows.map(x => `
            <article class="student-certificate">
              <span class="student-status good">شهادة صادرة</span>
              <h3>${esc(x.courseId?.title || 'دورة')}</h3>
              <p style="margin:0;color:var(--text-mute);font-size:10px">صادرة باسم ${esc(user.name || 'الطالب')}</p>
              <div class="student-certificate-number" style="margin-top:12px">${esc(x.certificateNo)}</div>
              <div class="student-meta"><span>${fmtDate(x.issuedAt)}</span><span>${esc(x.courseId?.code || '')}</span></div>
            </article>
          `).join('')+'</div>' : '<div class="student-empty">لم تصدر لك شهادات حتى الآن.</div>'}
        </section>
      `;

      const print = document.getElementById('printCertificates');
      if (print) print.onclick = () => window.print();

      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';

  }

  async function renderNotifications() {
    const target = document.getElementById('studentPageContent');
    target.innerHTML = '<div class="student-empty">جاري تحميل الإشعارات...</div>';

    try {
      const rows = await api('/api/student/notifications');

      target.innerHTML = `
        <section class="student-card">
          <div class="student-card-head"><div><h2>آخر الإشعارات</h2><p>إشعارات الأكاديمية الموجهة للطلاب.</p></div></div>
          ${rows.length ? rows.map(x => `
            <article class="student-notification ${x.type==='live_reminder'?'student-notification-live':''}">
              ${x.type==='live_reminder'?'<span class="student-notification-badge">تنبيه محاضرة</span>':''}
              <h3>${esc(x.title)}</h3>
              <p>${esc(x.message)}</p>
              ${x.liveSessionId?'<div class="student-actions"><button class="btn primary student-join-live" data-session-id="'+esc(x.liveSessionId._id||x.liveSessionId)+'" type="button">دخول المحاضرة</button></div>':''}
              <small>${fmtDate(x.sentAt || x.createdAt,true)}</small>
            </article>
          `).join('') : '<div class="student-empty">لا توجد إشعارات حاليًا.</div>'}
        </section>
      `;
      bindLiveJoinButtons();
    } catch (err) {
      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  async function renderProfile() {
    const target = document.getElementById('studentPageContent');
    target.innerHTML = '<div class="student-empty">جاري تحميل الحساب...</div>';

    try {
      const data = await api('/api/student/profile');
      profileCache = data;

      target.innerHTML = `
        <section class="student-profile-grid">
          <article class="student-profile-card">
            <div class="student-profile-avatar">${esc((data.user.name || 'ST').slice(0,2).toUpperCase())}</div>
            <h2>${esc(data.user.name)}</h2>
            <p>${esc(data.user.email)}</p>
            <div class="student-meta" style="margin-top:14px">
              <span>طالب</span>
              <span>${esc(data.academy.name)}</span>
              <span>${esc(data.academy.code)}</span>
            </div>
          </article>

          <article class="student-card">
            <div class="student-card-head"><div><h2>بياناتي</h2><p>يمكنك تعديل الاسم ورقم الهاتف.</p></div></div>
            <form id="studentProfileForm">
              <div class="field"><label>الاسم</label><input name="name" value="${esc(data.user.name || '')}" required></div>
              <div class="field"><label>البريد الإلكتروني</label><input value="${esc(data.user.email || '')}" disabled></div>
              <div class="field"><label>رقم الهاتف</label><input name="phone" value="${esc(data.user.phone || '')}"></div>
              <div class="student-form-message" id="profileMsg"></div>
              <button class="btn primary" type="submit">حفظ البيانات</button>
            </form>
          </article>
        </section>

        <section class="student-card student-section">
          <div class="student-card-head">
            <div><h2>أمان الحساب</h2><p>غيّر كلمة المرور الحالية بكلمة جديدة لا تقل عن 10 أحرف.</p></div>
            <button class="btn secondary" id="changePasswordButton" type="button">تغيير كلمة المرور</button>
          </div>
        </section>
      `;

      document.getElementById('studentProfileForm').onsubmit = async e => {
        e.preventDefault();
        const form = e.currentTarget;
        const btn = form.querySelector('button[type="submit"]');
        const msg = document.getElementById('profileMsg');
        const original = btn.textContent;

        btn.disabled = true;
        btn.textContent = 'جاري الحفظ...';
        msg.textContent = '';

        try {
          const saved = await api('/api/student/profile',{
            method:'PATCH',
            body:JSON.stringify(Object.fromEntries(new FormData(form).entries()))
          });

          user.name = saved.name;
          localStorage.setItem('af_user',JSON.stringify(user));
          msg.style.color = 'var(--success)';
          msg.textContent = 'تم حفظ البيانات.';
        } catch (err) {
          msg.style.color = 'var(--danger)';
          msg.textContent = err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      };

      document.getElementById('changePasswordButton').onclick = openPasswordModal;
    } catch (err) {
      target.innerHTML = '<div class="student-card student-empty">'+esc(err.message)+'</div>';
    }
  }

  function openPasswordModal() {
    openModal({
      title:'تغيير كلمة المرور',
      subtitle:'استخدم كلمة مرور جديدة لا تقل عن 10 أحرف.',
      html:`
        <div class="field"><label>كلمة المرور الحالية</label><input name="currentPassword" type="password" autocomplete="current-password" required></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input name="newPassword" type="password" autocomplete="new-password" minlength="10" required></div>
        <div class="student-form-message"></div>
        <div class="student-actions" style="justify-content:flex-end"><button class="btn primary" type="submit">تغيير كلمة المرور</button></div>
      `,
      onSubmit:async data => {
        await api('/api/student/profile/password',{
          method:'POST',
          body:JSON.stringify(data)
        });
        closeModal();
        alert('تم تغيير كلمة المرور بنجاح.');
      }
    });
  }

  async function init() {
    renderShell();
    startUrgentReminderPolling();

    if (page === 'quizzes' && window.StudentQuiz) return window.StudentQuiz.renderList();
    if (page === 'quiz' && window.StudentQuiz) return window.StudentQuiz.renderQuizPage();
    if (page === 'dashboard') return renderDashboard();
    if (page === 'courses') return renderCourses();
    if (page === 'course') return renderCourse();
    if (page === 'live') return renderLive();
    if (page === 'assignments') return renderAssignments();
    if (page === 'quizzes') return renderQuizzes();
    if (page === 'payments') return renderPayments();
    if (page === 'certificates') return renderCertificates();
    if (page === 'notifications') return renderNotifications();
    if (page === 'profile') return renderProfile();

    document.getElementById('studentPageContent').innerHTML = '<div class="student-card student-empty">الصفحة غير موجودة.</div>';
  }

  document.addEventListener('DOMContentLoaded',init);

  return { api };
})();
</script>
</body>
</html>
