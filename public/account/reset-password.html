<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>كلمة مرور جديدة | AcademyFlow</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/account.css"><script src="/js/account-security.js" defer></script></head>
<body data-account-page="reset"><main class="account-main"><a href="/academy/login.html">تسجيل الدخول</a><h1>كلمة مرور جديدة</h1><form id="resetForm"><label>كلمة المرور الجديدة<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label>رمز تطبيق المصادقة، إن كان مفعّلاً<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><button class="btn primary" type="submit">تغيير كلمة المرور</button></form><p id="message" role="status" aria-live="polite"></p></main></body></html>
