<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>أمان الحساب | AcademyFlow</title><link rel="stylesheet" href="/css/app.css?v=20260930-interior"><link rel="stylesheet" href="/css/account.css"><script src="/js/account-security.js" defer></script><script src="/js/ui.js?v=20260930-interior"></script><link rel="stylesheet" href="/css/workspace.css?v=20260930-interior">
<script src="/js/workspace.js?v=20260930-interior"></script>
</head>
<body class="af-workspace" data-account-page="security"><main class="account-main"><a id="backLink" href="/academy/dashboard.html">العودة</a><h1>أمان الحساب</h1><p id="message" role="status" aria-live="polite"></p>
<section><h2>كلمة المرور</h2><form id="passwordForm"><label>كلمة المرور الحالية<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>كلمة المرور الجديدة<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label class="mfa-code" hidden>رمز تطبيق المصادقة<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><button class="btn primary" type="submit">تغيير كلمة المرور</button></form></section>
<section><h2>المصادقة الثنائية</h2><p id="mfaStatus"></p><form id="setupForm"><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">تجهيز المصادقة</button></form><form id="confirmForm" hidden><output id="mfaSecret"></output><label>رمز التطبيق<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn primary" type="submit">تفعيل المصادقة</button></form><form id="disableForm" hidden><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><label>رمز التطبيق<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn secondary" type="submit">إيقاف المصادقة</button></form></section>
<section><h2>الإشعارات</h2><form id="preferencesForm"><label class="choice"><input name="email" type="checkbox">البريد الإلكتروني</label><label class="choice"><input name="whatsapp" type="checkbox">أوافق على استقبال إشعارات الأكاديمية على WhatsApp</label><button class="btn primary" type="submit">حفظ التفضيلات</button></form></section>
</main></body></html>
