name: AcademyFlow Security Scan

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academyflow-security-main
  cancel-in-progress: true

jobs:
  sast:
    name: SAST and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare report directory
        run: mkdir -p security-reports

      - name: NPM dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > security-reports/npm-audit.json
          npm audit > security-reports/npm-audit.txt 2>&1
          exit 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep OWASP scan
        shell: bash
        run: |
          set +e
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --json \
            --output security-reports/semgrep.json \
            .
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --text \
            --output security-reports/semgrep.txt \
            .
          exit 0

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: academyflow-sast-reports
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce SAST results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          report_dir = pathlib.Path("security-reports")
          failures = []

          audit_path = report_dir / "npm-audit.json"
          if not audit_path.exists():
              failures.append("npm audit report is missing")
          else:
              try:
                  audit = json.loads(audit_path.read_text(encoding="utf-8"))
                  vulns = audit.get("metadata", {}).get("vulnerabilities", {})
                  found = {
                      level: int(vulns.get(level, 0) or 0)
                      for level in ("low", "moderate", "high", "critical")
                  }
                  if sum(found.values()):
                      failures.append(
                          "npm audit vulnerabilities: " +
                          ", ".join(f"{k}={v}" for k, v in found.items() if v)
                      )
              except Exception as exc:
                  failures.append(f"npm audit report could not be parsed: {exc}")

          semgrep_path = report_dir / "semgrep.json"
          if not semgrep_path.exists():
              failures.append("Semgrep report is missing")
          else:
              try:
                  semgrep = json.loads(semgrep_path.read_text(encoding="utf-8"))
                  results = semgrep.get("results") or []
                  errors = semgrep.get("errors") or []
                  if results:
                      failures.append(f"Semgrep findings: {len(results)}")
                  if errors:
                      failures.append(f"Semgrep scan errors: {len(errors)}")
              except Exception as exc:
                  failures.append(f"Semgrep report could not be parsed: {exc}")

          if failures:
              print("Security gate failed:")
              for item in failures:
                  print(f" - {item}")
              sys.exit(1)

          print("SAST gate passed: no dependency vulnerabilities, Semgrep findings, or scan errors.")
          PY


  tenant_isolation:
    name: Tenant isolation regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/academyflow_tenant_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tenant isolation regression tests
        run: npm run test:tenant-isolation


  rbac:
    name: RBAC regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27018/academyflow_rbac_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find src scripts public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run RBAC regression tests
        run: npm run test:rbac


  backup_restore:
    name: Backup and restore regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27019/academyflow_backup_test
      BACKUP_DIR: /tmp/academyflow-backup-ci
      BACKUP_ENCRYPTION_KEY: backup-ci-encryption-key-0123456789-abcdefghijklmnopqrstuvwxyz
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check backup JavaScript syntax
        shell: bash
        run: |
          node --check src/services/backup.service.js
          node --check src/services/backup-worker.service.js
          node --check scripts/backup-restore-test.js

      - name: Run destructive backup restore regression
        run: npm run test:backup-restore

  dast:
    name: DAST - OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare report directory
        run: |
          mkdir -p security-reports
          chmod 777 security-reports

      - name: Allow production deployment to settle
        run: sleep 60

      - name: Capture security headers
        shell: bash
        run: |
          set +e
          curl -sS -D security-reports/headers.txt -o /dev/null https://academyflow.up.railway.app/
          curl -sS -L --max-time 30 https://academyflow.up.railway.app/ -o security-reports/homepage.html
          exit 0

      - name: OWASP ZAP baseline scan
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD/security-reports:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t https://academyflow.up.railway.app \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I
          ZAP_EXIT_CODE=$?
          echo "$ZAP_EXIT_CODE" > security-reports/zap-exit-code.txt
          exit 0

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: academyflow-dast-reports
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce DAST results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report_dir = pathlib.Path("security-reports")
          failures = []

          exit_path = report_dir / "zap-exit-code.txt"
          if not exit_path.exists():
              failures.append("ZAP exit-code file is missing")
          else:
              try:
                  code = int(exit_path.read_text(encoding="utf-8").strip())
                  if code not in (0, 2):
                      failures.append(f"ZAP scanner failed with exit code {code}")
              except Exception as exc:
                  failures.append(f"ZAP exit code could not be parsed: {exc}")

          report_path = report_dir / "zap-report.json"
          if not report_path.exists():
              failures.append("ZAP JSON report is missing")
          else:
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  alerts = []
                  for site in report.get("site", []) or []:
                      alerts.extend(site.get("alerts", []) or [])

                  blocking = []
                  for alert in alerts:
                      try:
                          risk = int(alert.get("riskcode", 0) or 0)
                      except (TypeError, ValueError):
                          risk = 0
                      if risk >= 2:
                          blocking.append(alert)

                  if blocking:
                      names = sorted({
                          str(alert.get("name") or alert.get("alert") or "Unknown alert")
                          for alert in blocking
                      })
                      failures.append(
                          f"ZAP medium/high alerts: {len(blocking)} (" +
                          "; ".join(names[:10]) + ")"
                      )
              except Exception as exc:
                  failures.append(f"ZAP report could not be parsed: {exc}")

          if failures:
              print("DAST gate failed:")
              for item in failures:
                  print(f" - {item}")
              sys.exit(1)

          print("DAST gate passed: no medium/high ZAP alerts and the scanner completed successfully.")
          PY
