name: AcademyFlow Readiness

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academyflow-readiness-main-v12
  cancel-in-progress: true

jobs:
  readiness:
    name: Monitoring, E2E and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27020:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27020/academyflow_readiness_test
      NODE_ENV: test
      PERFORMANCE_P95_MS: 2500
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check readiness JavaScript syntax
        shell: bash
        run: |
          node --check src/services/system-monitor.service.js
          node --check src/services/audit.service.js
          node --check src/middleware/audit.js
          node --check scripts/monitoring-test.js
          node --check scripts/mongodb-storage-test.js
          node --check scripts/migrate-storage-to-mongodb.js
          node --check src/services/certificate-storage.service.js
          node --check src/controllers/certificate.controller.js
          node --check scripts/e2e-test.js
          node --check scripts/performance-smoke-test.js
          node --check scripts/legal-readiness-test.js

      - name: Monitoring alert regression
        run: node scripts/test-local.js monitoring-test.js

      - name: MongoDB GridFS certificate storage
        run: node scripts/test-local.js mongodb-storage-test.js

      - name: Legal readiness and privacy rights
        run: node scripts/test-local.js legal-readiness-test.js

      - name: End-to-end academy journey
        run: node scripts/test-local.js e2e-test.js

      - name: Safe performance smoke
        run: node scripts/test-local.js performance-smoke-test.js
      - name: Security and reliability fixes
        run: npm run test:fixes
