name: Promote AcademyFlow Production

on:
  workflow_run:
    workflows: [ "AcademyFlow Staging Validation" ]
    types: [ completed ]

permissions:
  contents: write

concurrency:
  group: academyflow-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote validated main to production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fast-forward production branch only
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin production main

          if ! git merge-base --is-ancestor origin/production "$VALIDATED_SHA"; then
            echo "Production is not an ancestor of the validated commit."
            echo "Refusing to force-push or rewrite production history."
            exit 1
          fi

          git push origin "$VALIDATED_SHA:refs/heads/production"

      - name: Promotion summary
        shell: bash
        run: |
          echo "Validated staging commit promoted to production branch:"
          echo "${{ github.event.workflow_run.head_sha }}"
