name: Generate package lock

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: academyflow-lockfile
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Generate deterministic lockfile if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "academyflow-ci"
          git config user.email "academyflow-ci@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add deterministic package lock"
          git push origin HEAD:main
