name: Security Remediation Verification

on:
  push:
    branches:
      - security/codeql-remediation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-remediation-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Regression and syntax verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27021:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27021/academyflow_security_remediation
      BACKUP_DIR: /tmp/academyflow-security-remediation-backups
      BACKUP_ENCRYPTION_KEY: backup-ci-encryption-key-0123456789-abcdefghijklmnopqrstuvwxyz
      NODE_ENV: test
      PERFORMANCE_P95_MS: 2500

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src scripts public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Security input, PDF and webhook regression
        run: node scripts/security-regression-test.js

      - name: Tenant isolation regression
        run: npm run test:tenant-isolation

      - name: RBAC regression
        run: npm run test:rbac

      - name: Backup and restore regression
        run: npm run test:backup-restore

      - name: Monitoring regression
        env:
          BACKUP_DIR: /tmp/academyflow-security-monitor-backups
        run: npm run test:monitoring

      - name: Legal readiness regression
        run: npm run test:legal

      - name: End-to-end regression
        run: npm run test:e2e

      - name: Performance smoke
        run: npm run test:performance

